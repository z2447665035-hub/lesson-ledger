<style>
:root{--bg:#f4f0e8;--ink:#171613;--muted:#6f6a5f;--sage:#87916f;--sage-dark:#45503a;--gold:#c7a45b;--blue:#536f86;--clay:#b96f53;--shadow:0 18px 46px rgb(45 37 25 / 10%)}*{box-sizing:border-box}body{margin:0;min-height:100%;background:radial-gradient(circle at 18% -8%,rgb(199 164 91 / 22%),transparent 34%),linear-gradient(145deg,#f7f2e9 0%,#ebe3d6 52%,#f6f2ea 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}h1,h2,p{margin:0}.shell{width:min(100%,1180px);min-height:100svh;margin:0 auto;padding:22px 18px 96px}.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;padding:18px 0 16px}.eyebrow{margin:0 0 8px;color:var(--sage-dark);font-size:12px;font-weight:800;text-transform:uppercase}h1{font-size:clamp(32px,8vw,58px);font-weight:760;line-height:.96}h2{font-size:18px;font-weight:780}.subcopy{max-width:620px;margin-top:12px;color:var(--muted);font-size:15px;line-height:1.7}.card,.metric,.panel{border:1px solid rgb(23 22 19 / 10%);border-radius:8px;background:rgb(255 253 250 / 82%);box-shadow:var(--shadow)}.heroMetric{min-width:178px;padding:16px}.muted,.heroMetric span,.metric span,.panelTitle span,.row span,label{color:var(--muted)}.heroMetric strong{display:block;margin-top:6px;color:var(--sage-dark);font-size:25px;line-height:1.1}.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0 18px;border:1px solid rgb(23 22 19 / 10%);border-radius:8px;background:rgb(255 253 250 / 76%);padding:6px;backdrop-filter:blur(16px)}.tabs button{min-height:42px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-weight:740}.tabs button.active{background:var(--ink);color:#fffdfa;box-shadow:0 8px 22px rgb(23 22 19 / 16%)}.view{display:grid;gap:14px}.wide{grid-column:1/-1}.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{min-height:104px;padding:17px}.metric span{display:block;font-size:13px;font-weight:680}.metric strong{display:block;margin-top:15px;font-size:clamp(22px,5vw,34px);line-height:1}.panel{padding:16px}.panelTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panelTitle span{flex:0 0 auto;font-size:12px;font-weight:720}.list{display:grid;gap:10px}.row,.quickCard{border:1px solid rgb(23 22 19 / 8%);border-radius:8px;background:rgb(255 255 255 / 62%)}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;min-height:74px;padding:12px}.row strong,.row b{display:block;overflow:hidden;font-size:15px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}.row span{display:block;overflow:hidden;margin-top:4px;font-size:12px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}.rowActions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.iconBtn,.tinyBtn{border:1px solid rgb(23 22 19 / 10%);border-radius:6px;background:#fffdfa;color:var(--ink);font-weight:800}.iconBtn{min-width:34px;height:34px}.tinyBtn{min-height:34px;padding:0 10px}.delete{color:#8d432c}.pill{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:28px;border-radius:999px;font-size:12px;font-style:normal;font-weight:820}.good{background:rgb(135 145 111 / 16%);color:var(--sage-dark)}.soft{background:rgb(83 111 134 / 14%);color:var(--blue)}.warn{background:rgb(185 111 83 / 15%);color:#8d432c}.accent{background:rgb(199 164 91 / 18%);color:#806126}.form{display:grid;gap:12px}label{display:grid;gap:7px;font-size:12px;font-weight:760}input,select{width:100%;min-height:46px;border:1px solid rgb(23 22 19 / 12%);border-radius:7px;background:rgb(255 255 255 / 84%);color:var(--ink);outline:none;padding:0 12px}input:focus,select:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgb(135 145 111 / 18%)}.formSplit{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formTri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.primary{min-height:48px;border:0;border-radius:7px;background:var(--sage-dark);color:#fffdfa;font-weight:860;box-shadow:0 12px 26px rgb(69 80 58 / 22%)}.secondary{min-height:42px;border:1px solid rgb(23 22 19 / 12%);border-radius:7px;background:#fffdfa;color:var(--ink);font-weight:820}.quickGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.quickCard{display:grid;gap:12px;padding:14px}.quickTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.quickTop strong{font-size:16px}.quickTop span,.quickMeta span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.quickBtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quickBtns button{min-height:40px;border:0;border-radius:7px;background:var(--ink);color:#fffdfa;font-weight:860}.quickBtns button:nth-child(2){background:var(--sage-dark)}.quickBtns button:nth-child(3){background:#806126}.quickBtns button:nth-child(4){background:#8d432c}.quickMeta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{height:8px;overflow:hidden;border-radius:999px;background:#e8e1d5}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--sage),var(--gold))}.chart{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end;height:220px;padding-top:8px}.barCol{display:grid;gap:8px;align-items:end;height:100%;text-align:center}.barStick{display:flex;align-items:end;height:158px;border-radius:7px;background:rgb(23 22 19 / 5%);overflow:hidden}.barFill{width:100%;min-height:4px;background:linear-gradient(180deg,var(--sage),var(--gold))}.barCol b{font-size:11px}.barCol span{color:var(--muted);font-size:11px}.rateTags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.rateTags i{border-radius:999px;background:rgb(135 145 111 / 14%);color:var(--sage-dark);font-size:12px;font-style:normal;font-weight:760;padding:6px 9px}.miniTable{display:grid;gap:6px}.dayGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dayCell{min-height:46px;border:1px solid rgb(23 22 19 / 9%);border-radius:7px;background:rgb(255 255 255 / 66%);padding:6px;font-size:11px}.dayCell b{display:block}.dayCell span{color:var(--muted)}@media (min-width:860px){.view{grid-template-columns:.9fr 1.1fr;align-items:start}.tabs{width:720px}}@media (max-width:820px){.shell{padding:18px 14px 92px}.hero{grid-template-columns:1fr}.heroMetric{min-width:0}.statGrid{grid-template-columns:1fr 1fr}.quickGrid{grid-template-columns:1fr}.metric{min-height:94px;padding:14px}.row{grid-template-columns:1fr}.rowActions{justify-content:flex-start}.tabs button{font-size:12px}.chart{grid-template-columns:repeat(4,1fr);height:auto}.barStick{height:120px}}@media (max-width:460px){.formSplit,.formTri,.statGrid{grid-template-columns:1fr}.quickBtns{grid-template-columns:1fr 1fr}.tabs{grid-template-columns:repeat(3,1fr)}.dayGrid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main class="shell">
<section class="hero"><div><p class="eyebrow">Lesson Ledger</p><h1>课时与财务</h1><p class="subcopy">参考你的经营数据表，收入、考勤、老师费用、奖金和项目收益放在一处管理。</p></div><div class="card heroMetric"><span>本月净收益</span><strong id="profitHero">¥0</strong></div></section>
<nav class="tabs"><button class="active" data-tab="overview">看板</button><button data-tab="lesson">考勤</button><button data-tab="students">学员</button><button data-tab="teachers">老师</button><button data-tab="finance">财务</button><button data-tab="settings">设置</button></nav>
<section id="app"></section>
</main>
<script>
const today=new Date().toISOString().slice(0,10),month=today.slice(0,7);
const labels={attended:"出勤",leave:"请假",absent:"旷课",makeup:"补课"},classes={attended:"good",leave:"soft",absent:"warn",makeup:"accent"};
const seed={projects:["基泰一一对一","情景口语一对一","基泰一小班","情景口语小班","录播课","情景口语小班6","情景口语小班3"].map((name,i)=>({id:"p"+(i+1),name})),teachers:["荔枝","小凡","栗子","nana","涛哥"].map((name,i)=>({id:"t"+i,name})),teacherRates:[{id:"r0",teacherId:"t0",projectId:"p1",rate:0},{id:"r1",teacherId:"t0",projectId:"p3",rate:0},{id:"r2",teacherId:"t1",projectId:"p4",rate:120},{id:"r3",teacherId:"t2",projectId:"p1",rate:130},{id:"r4",teacherId:"t2",projectId:"p2",rate:150},{id:"r5",teacherId:"t3",projectId:"p5",rate:80}],students:[{id:"s1",name:"谢同学",region:"四川",reason:"工作",projectId:"p1",teacherId:"t0",packageHours:20,defaultHours:1,hourlyRate:130,paid:2600,saleDate:"2026-03-04",paymentMethod:"一次付清",status:"结课学员",renewal:"否",note:"3.15起消课18h"},{id:"s2",name:"徐必静",region:"",reason:"",projectId:"p4",teacherId:"t1",packageHours:20,defaultHours:1,hourlyRate:100,paid:2000,saleDate:"2026-03-12",paymentMethod:"一次付清",status:"在读学员",renewal:"否",note:"情景口语小班"},{id:"s3",name:"蛋蛋",region:"山西",reason:"追星",projectId:"p4",teacherId:"t0",packageHours:51,defaultHours:1,hourlyRate:100,paid:5100,saleDate:"2025-11-24",paymentMethod:"上一付一",status:"在读学员",renewal:"是",note:"续费情景口语"},{id:"s4",name:"何蕊",region:"",reason:"",projectId:"p1",teacherId:"t2",packageHours:20,defaultHours:1,hourlyRate:130,paid:2600,saleDate:"2026-05-01",paymentMethod:"一次付清",status:"在读学员",renewal:"否",note:"栗子授课"},{id:"s5",name:"孙祺明",region:"",reason:"",projectId:"p2",teacherId:"t0",packageHours:10,defaultHours:1,hourlyRate:130,paid:1300,saleDate:"2026-07-01",paymentMethod:"一次付清",status:"在读学员",renewal:"否",note:"情景口语一对一"}],lessons:[{id:"l1",date:today,studentId:"s1",projectId:"p1",teacherId:"t0",hours:1,status:"attended",note:"一键记录"},{id:"l2",date:today,studentId:"s2",projectId:"p4",teacherId:"t1",hours:1,status:"attended",note:"小班课"},{id:"l3",date:"2026-08-08",studentId:"s5",projectId:"p2",teacherId:"t0",hours:1,status:"attended",note:"口语"},{id:"l4",date:"2026-07-28",studentId:"s3",projectId:"p4",teacherId:"t0",hours:1,status:"attended",note:"情景口语"},{id:"l5",date:"2026-06-01",studentId:"s4",projectId:"p1",teacherId:"t2",hours:1,status:"attended",note:"基泰一"}],expenses:[{id:"e1",date:"2026-08-20",projectId:"p1",category:"教材",amount:186},{id:"e2",date:"2026-08-23",projectId:"p4",category:"投放",amount:420}],bonuses:[{id:"b1",month:"2026-06",teacherId:"t2",amount:300,note:"3月报名学生续费奖金"}],monthlySales:[["2025-09",13,17846],["2025-10",7,12290],["2025-11",6,10639],["2025-12",2,6300],["2026-01",3,5310],["2026-02",5,7530],["2026-03",21,50670],["2026-04",4,8660],["2026-05",4,7670],["2026-06",13,37930],["2026-07",4,9100]].map(x=>({month:x[0],count:x[1],revenue:x[2]}))};
let state=migrate(load("lesson-ledger-v4",null)||load("lesson-ledger-v3",null)||load("lesson-ledger-v2",null)||legacy()||seed);
function legacy(){try{const students=JSON.parse(localStorage.getItem("offline.students")),lessons=JSON.parse(localStorage.getItem("offline.lessons")),expenses=JSON.parse(localStorage.getItem("offline.expenses"));if(!students)return null;return{...seed,students,lessons:lessons||[],expenses:expenses||[]}}catch{return null}}
function load(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}function save(){localStorage.setItem("lesson-ledger-v4",JSON.stringify({...state,tab:undefined}))}
function migrate(d){const projects=d.projects||seed.projects,teachers=(d.teachers||seed.teachers).map(t=>({id:t.id,name:t.name})),pByName=Object.fromEntries(projects.map(p=>[p.name,p.id]));let teacherRates=d.teacherRates;if(!teacherRates){teacherRates=(d.teachers||[]).flatMap(t=>projects.map(p=>({id:crypto.randomUUID(),teacherId:t.id,projectId:p.id,rate:Number(t.rate||0)})));if(!teacherRates.length)teacherRates=seed.teacherRates}return{projects,teachers,teacherRates,monthlySales:d.monthlySales||seed.monthlySales,bonuses:d.bonuses||seed.bonuses,students:(d.students||[]).map(s=>({...s,region:s.region||"",reason:s.reason||"",projectId:s.projectId||pByName[s.project]||"p1",teacherId:s.teacherId||"t0",defaultHours:Number(s.defaultHours||1),hourlyRate:Number(s.hourlyRate||s.paid/s.packageHours||0),saleDate:s.saleDate||today,paymentMethod:s.paymentMethod||"一次付清",status:s.status||"在读学员",renewal:s.renewal||"否",note:s.note||""})),lessons:(d.lessons||[]).map(l=>({...l,projectId:l.projectId||pByName[l.project]||"p1",teacherId:l.teacherId||d.students?.find(s=>s.id===l.studentId)?.teacherId||"t0"})),expenses:(d.expenses||[]).map(e=>({...e,projectId:e.projectId||pByName[e.project]||"p1"})),tab:"overview"}}
const money=v=>new Intl.NumberFormat("zh-CN",{style:"currency",currency:"CNY",maximumFractionDigits:0}).format(v||0),fmt=(v,d=1)=>new Intl.NumberFormat("zh-CN",{maximumFractionDigits:d}).format(v||0);
const maps=()=>({p:Object.fromEntries(state.projects.map(x=>[x.id,x])),t:Object.fromEntries(state.teachers.map(x=>[x.id,x])),s:Object.fromEntries(state.students.map(x=>[x.id,x]))});
function getRate(t,p){return Number(state.teacherRates.find(r=>r.teacherId===t&&r.projectId===p)?.rate||0)}function billable(l){return l.status!=="leave"}function fee(l){return billable(l)?l.hours*getRate(l.teacherId,l.projectId):0}
function calc(m=null){const ls=m?state.lessons.filter(l=>l.date.startsWith(m)):state.lessons,ss=m?state.students.filter(s=>s.saleDate.startsWith(m)):state.students,es=m?state.expenses.filter(e=>e.date.startsWith(m)):state.expenses,bs=m?state.bonuses.filter(b=>b.month===m):state.bonuses;const revenue=ss.reduce((a,s)=>a+s.paid,0),hours=ls.filter(billable).reduce((a,l)=>a+l.hours,0),teacher=ls.reduce((a,l)=>a+fee(l),0),expense=es.reduce((a,e)=>a+e.amount,0),bonus=bs.reduce((a,b)=>a+b.amount,0),bought=state.students.reduce((a,s)=>a+s.packageHours,0),used=state.lessons.filter(billable).reduce((a,l)=>a+l.hours,0);return{revenue,hours,teacher,expense,bonus,profit:revenue-teacher-expense-bonus,remaining:Math.max(0,bought-used),count:ss.length}}
function metric(a,b){return `<div class="metric"><span>${a}</span><strong>${b}</strong></div>`}function opts(items,val){return items.map(i=>`<option value="${i.id}" ${i.id===val?"selected":""}>${i.name}</option>`).join("")}function optText(items,val){return items.map(i=>`<option ${i===val?"selected":""}>${i}</option>`).join("")}
function del(type,id){if(!confirm("确定删除这一项吗？"))return;if(type==="student"){state.students=state.students.filter(x=>x.id!==id);state.lessons=state.lessons.filter(x=>x.studentId!==id)}if(type==="lesson")state.lessons=state.lessons.filter(x=>x.id!==id);if(type==="expense")state.expenses=state.expenses.filter(x=>x.id!==id);if(type==="bonus")state.bonuses=state.bonuses.filter(x=>x.id!==id);if(type==="teacher"){state.teachers=state.teachers.filter(x=>x.id!==id);state.teacherRates=state.teacherRates.filter(x=>x.teacherId!==id)}if(type==="project"){state.projects=state.projects.filter(x=>x.id!==id);state.teacherRates=state.teacherRates.filter(x=>x.projectId!==id)}if(type==="rate")state.teacherRates=state.teacherRates.filter(x=>x.id!==id);save();render()}
function addLesson(studentId,hours,status="attended",note="一键记录"){const s=maps().s[studentId];if(!s)return;state.lessons.unshift({id:crypto.randomUUID(),date:today,studentId:s.id,projectId:s.projectId,teacherId:s.teacherId,hours:Number(hours),status,note});save();render()}
function row(title,sub,actions=""){return `<div class="row"><div><strong>${title}</strong><span>${sub}</span></div><div class="rowActions">${actions}</div></div>`}
function lessonRow(l){const m=maps(),s=m.s[l.studentId],p=m.p[l.projectId],t=m.t[l.teacherId],rate=getRate(l.teacherId,l.projectId);return row(`${s?.name||"未知学员"} · ${fmt(l.hours)}h`,`${l.date} · ${p?.name||"未分类"} · ${t?.name||"未指定"} · 课时费 ${money(rate)}/h · 成本 ${money(fee(l))}`,`<i class="pill ${classes[l.status]}">${labels[l.status]}</i><button class="iconBtn delete" onclick="del('lesson','${l.id}')">删</button>`)}
function render(){const now=calc(month),all=calc();document.getElementById("profitHero").textContent=money(now.profit);document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));const app=document.getElementById("app");({overview,lesson,students,teachers,finance,settings}[state.tab]||overview)(app)}
function overview(app){const now=calc(month),all=calc();app.innerHTML=`<section class="view"><div class="statGrid wide">${metric("本月销售额",money(now.revenue))}${metric("本月课消",fmt(now.hours)+"h")}${metric("本月老师费",money(now.teacher))}${metric("剩余课时",fmt(all.remaining)+"h")}</div><section class="panel wide"><div class="panelTitle"><h2>月度销售额</h2><span>来自经营表口径 + 新录入</span></div>${salesChart()}</section><section class="panel"><div class="panelTitle"><h2>今天要记</h2><span>${state.students.length} 名学员</span></div><div class="list">${state.students.slice(0,6).map(quick).join("")}</div></section><section class="panel"><div class="panelTitle"><h2>本月课消日历</h2><span>${fmt(now.hours)}h</span></div>${dayGrid(month)}</section></section>`}
function quick(s){const m=maps(),p=m.p[s.projectId],t=m.t[s.teacherId],rate=getRate(s.teacherId,s.projectId);return `<div class="quickCard"><div class="quickTop"><div><strong>${s.name}</strong><span>${p?.name||""} · ${t?.name||""} · ${money(rate)}/h</span></div><button class="iconBtn delete" onclick="del('student','${s.id}')">删</button></div><div class="quickBtns"><button onclick="addLesson('${s.id}',${s.defaultHours})">默认${fmt(s.defaultHours)}h</button><button onclick="addLesson('${s.id}',1)">1h</button><button onclick="addLesson('${s.id}',${s.defaultHours},'makeup','补课')">补课</button><button onclick="addLesson('${s.id}',${s.defaultHours},'leave','请假')">请假</button></div></div>`}
function lesson(app){app.innerHTML=`<section class="view"><section class="panel wide"><div class="panelTitle"><h2>一键考勤</h2><span>日期自动取今天，按学员绑定老师和项目算课时费</span></div><div class="quickGrid">${state.students.map(quick).join("")}</div></section><form class="panel form" id="lessonForm"><div class="panelTitle"><h2>补录历史课</h2><span>参考考勤总表</span></div><label>日期<input name="date" type="date" value="${today}"></label><label>学员<select name="studentId">${opts(state.students,state.students[0]?.id)}</select></label><div class="formSplit"><label>课时<input name="hours" min="0" step="0.5" type="number" value="1"></label><label>考勤<select name="status"><option value="attended">出勤</option><option value="leave">请假</option><option value="absent">旷课</option><option value="makeup">补课</option></select></label></div><label>备注<input name="note" placeholder="第几课、补课、作业反馈"></label><button class="primary">保存记录</button></form><section class="panel"><div class="panelTitle"><h2>最近记录</h2><span>${state.lessons.length} 条</span></div><div class="list">${state.lessons.map(lessonRow).join("")}</div></section></section>`;bind()}
function students(app){const m=maps();const rows=state.students.map(s=>{const ls=state.lessons.filter(l=>l.studentId===s.id),used=ls.filter(billable).reduce((a,l)=>a+l.hours,0),remain=Math.max(0,s.packageHours-used),cost=ls.reduce((a,l)=>a+fee(l),0),pct=Math.min(100,used/s.packageHours*100),rate=getRate(s.teacherId,s.projectId);return `<div class="quickCard"><div class="quickTop"><div><strong>${s.name}</strong><span>${m.p[s.projectId]?.name||""} · ${m.t[s.teacherId]?.name||""} · ${s.status}</span></div><button class="iconBtn delete" onclick="del('student','${s.id}')">删</button></div><div class="bar"><i style="width:${pct}%"></i></div><div class="quickMeta"><span>${s.region||"未填地区"} · ${s.reason||"未填原因"} · ${s.paymentMethod}</span><span>总销 ${money(s.paid)} / 余 ${fmt(remain)}h</span><span>续费 ${s.renewal} · ${money(rate)}/h</span><span>毛利 ${money(s.paid-cost)}</span></div></div>`}).join("");app.innerHTML=`<section class="view"><form class="panel form" id="studentForm"><div class="panelTitle"><h2>新增学员</h2><span>对应总收入明细数据</span></div><label>客户名称<input name="name" placeholder="学员姓名"></label><div class="formSplit"><label>地区<input name="region" placeholder="北京 / 四川成都"></label><label>学习原因<select name="reason">${optText(["追星","旅行/生活","工作","其他"],"追星")}</select></label></div><div class="formSplit"><label>报名课程<select name="projectId">${opts(state.projects,state.projects[0]?.id)}</select></label><label>授课老师<select name="teacherId">${opts(state.teachers,state.teachers[0]?.id)}</select></label></div><div class="formTri"><label>付款日期<input name="saleDate" type="date" value="${today}"></label><label>付款方式<select name="paymentMethod">${optText(["一次付清","上一付一"],"一次付清")}</select></label><label>状态<select name="status">${optText(["在读学员","结课学员","潜在学员","休眠学员"],"在读学员")}</select></label></div><div class="formTri"><label>课时单价<input name="hourlyRate" min="0" type="number" value="130"></label><label>购买课时<input name="packageHours" min="0" step="0.5" type="number" value="20"></label><label>默认课时<input name="defaultHours" min="0.5" step="0.5" type="number" value="1"></label></div><div class="formSplit"><label>销售额<input name="paid" min="0" type="number" value="2600"></label><label>是否续费<select name="renewal">${optText(["否","是"],"否")}</select></label></div><label>备注<input name="note" placeholder="特殊情况、赠课、续费来源"></label><button class="primary">添加学员</button></form><section class="panel"><div class="panelTitle"><h2>学员卡片</h2><span>${state.students.length} 人</span></div><div class="list">${rows}</div></section></section>`;bind()}
function teachers(app){const m=maps();const cards=state.teachers.map(t=>{const rates=state.teacherRates.filter(r=>r.teacherId===t.id),ls=state.lessons.filter(l=>l.teacherId===t.id&&billable(l)),hours=ls.reduce((a,l)=>a+l.hours,0),due=ls.reduce((a,l)=>a+fee(l),0),bonus=state.bonuses.filter(b=>b.teacherId===t.id).reduce((a,b)=>a+b.amount,0),tags=rates.map(r=>`<i>${m.p[r.projectId]?.name||"未分类"} ${money(r.rate)}/h <button class="tinyBtn delete" onclick="del('rate','${r.id}')">删</button></i>`).join("");return `<div class="quickCard"><div class="quickTop"><div><strong>${t.name}</strong><span>已上 ${fmt(hours)}h · 课时费 ${money(due)} · 奖金 ${money(bonus)}</span></div><button class="iconBtn delete" onclick="del('teacher','${t.id}')">删</button></div><div class="rateTags">${tags||"<i>还没有项目课时费</i>"}</div></div>`}).join("");app.innerHTML=`<section class="view"><form class="panel form" id="teacherForm"><div class="panelTitle"><h2>新增老师</h2><span>老师姓名</span></div><label>老师姓名<input name="name" placeholder="例如：新老师"></label><button class="primary">添加老师</button></form><form class="panel form" id="rateForm"><div class="panelTitle"><h2>项目课时费</h2><span>老师 + 课程项目</span></div><div class="formSplit"><label>老师<select name="teacherId">${opts(state.teachers,state.teachers[0]?.id)}</select></label><label>报名课程<select name="projectId">${opts(state.projects,state.projects[0]?.id)}</select></label></div><label>教师单节课时费<input name="rate" type="number" min="0" value="120"></label><button class="primary">保存课时费</button></form><form class="panel form" id="bonusForm"><div class="panelTitle"><h2>奖金统计</h2><span>会计入成本</span></div><div class="formSplit"><label>月份<input name="month" type="month" value="${month}"></label><label>教师<select name="teacherId">${opts(state.teachers,state.teachers[0]?.id)}</select></label></div><label>金额<input name="amount" type="number" min="0" value="300"></label><label>备注<input name="note" placeholder="例如：续费奖金"></label><button class="primary">添加奖金</button></form><section class="panel wide"><div class="panelTitle"><h2>老师卡片</h2><span>不同课程不同费用</span></div><div class="list">${cards}</div></section></section>`;bind()}
function finance(app){const now=calc(month),all=calc();const projectRows=state.projects.map(p=>{const ss=state.students.filter(s=>s.projectId===p.id),ls=state.lessons.filter(l=>l.projectId===p.id&&billable(l)),es=state.expenses.filter(e=>e.projectId===p.id),income=ss.reduce((a,s)=>a+s.paid,0),actual=ls.reduce((a,l)=>a+(maps().s[l.studentId]?.hourlyRate||0)*l.hours,0),hours=ls.reduce((a,l)=>a+l.hours,0),teacher=ls.reduce((a,l)=>a+fee(l),0),other=es.reduce((a,e)=>a+e.amount,0);return row(p.name,`项目总销售 ${money(income)} · 实际课消额 ${money(actual)} · 总课消 ${fmt(hours)}h · 老师费 ${money(teacher)} · 支出 ${money(other)}`,`<b>${money(income-teacher-other)}</b><button class="iconBtn delete" onclick="del('project','${p.id}')">删</button>`)}).join("");const bonusRows=state.bonuses.map(b=>row(`${b.month} · ${maps().t[b.teacherId]?.name||""}`,`${money(b.amount)} · ${b.note||"奖金"}`,`<button class="iconBtn delete" onclick="del('bonus','${b.id}')">删</button>`)).join("");app.innerHTML=`<section class="view"><div class="statGrid wide">${metric("项目总销售额",money(all.revenue))}${metric("总课消",fmt(all.hours)+"h")}${metric("本月销售额",money(now.revenue))}${metric("本月净收益",money(now.profit))}</div><section class="panel wide"><div class="panelTitle"><h2>项目收益状况</h2><span>销售 - 老师费 - 支出 - 奖金</span></div><div class="list">${projectRows}</div></section><section class="panel"><div class="panelTitle"><h2>奖金流水</h2><span>${state.bonuses.length} 条</span></div><div class="list">${bonusRows}</div></section><form class="panel form" id="expenseForm"><div class="panelTitle"><h2>记录项目支出</h2><span>教材、投放、资料</span></div><div class="formSplit"><label>日期<input name="date" type="date" value="${today}"></label><label>金额<input name="amount" type="number" min="0" value="0"></label></div><label>项目<select name="projectId">${opts(state.projects,state.projects[0]?.id)}</select></label><label>类目<input name="category" value="运营支出"></label><button class="primary">记录支出</button></form></section>`;bind()}
function settings(app){const projectRows=state.projects.map(p=>row(p.name,"课程项目 / 报名课程",`<button class="iconBtn delete" onclick="del('project','${p.id}')">删</button>`)).join("");app.innerHTML=`<section class="view"><form class="panel form" id="projectForm"><div class="panelTitle"><h2>课程项目</h2><span>新增后所有下拉可选</span></div><label>项目名称<input name="name" placeholder="例如：泰语发音课"></label><button class="primary">添加项目</button></form><section class="panel"><div class="panelTitle"><h2>项目列表</h2><span>${state.projects.length} 个</span></div><div class="list">${projectRows}</div></section></section>`;bind()}
function salesChart(){const live=[...state.monthlySales];const known=new Set(live.map(x=>x.month));state.students.forEach(s=>{if(!known.has(s.saleDate.slice(0,7)))live.push({month:s.saleDate.slice(0,7),count:0,revenue:0})});live.forEach(x=>{const extra=state.students.filter(s=>s.saleDate.startsWith(x.month)&&!seed.monthlySales.some(m=>m.month===x.month)).reduce((a,s)=>a+s.paid,0);x.revenue+=extra});const rows=live.sort((a,b)=>a.month.localeCompare(b.month)).slice(-8),max=Math.max(1,...rows.map(x=>x.revenue));return `<div class="chart">${rows.map(x=>`<div class="barCol"><div class="barStick"><div class="barFill" style="height:${Math.max(4,x.revenue/max*150)}px"></div></div><b>${money(x.revenue)}</b><span>${x.month.slice(5)}月 · ${x.count||""}人</span></div>`).join("")}</div>`}
function dayGrid(m){const days=new Date(Number(m.slice(0,4)),Number(m.slice(5,7)),0).getDate();let html='<div class="dayGrid">';for(let d=1;d<=days;d++){const date=m+"-"+String(d).padStart(2,"0"),ls=state.lessons.filter(l=>l.date===date),h=ls.filter(billable).reduce((a,l)=>a+l.hours,0);html+=`<div class="dayCell"><b>${d}号</b><span>${fmt(h)}h · ${ls.length}条</span></div>`}return html+"</div>"}
function bind(){const lf=document.getElementById("lessonForm");if(lf)lf.onsubmit=e=>{e.preventDefault();const f=new FormData(lf),s=maps().s[f.get("studentId")];state.lessons.unshift({id:crypto.randomUUID(),date:f.get("date"),studentId:s.id,projectId:s.projectId,teacherId:s.teacherId,hours:Number(f.get("hours")),status:f.get("status"),note:f.get("note")});save();render()};const sf=document.getElementById("studentForm");if(sf)sf.onsubmit=e=>{e.preventDefault();const f=new FormData(sf),hours=Number(f.get("packageHours")),rate=Number(f.get("hourlyRate"));state.students.unshift({id:crypto.randomUUID(),name:String(f.get("name")).trim(),region:f.get("region"),reason:f.get("reason"),projectId:f.get("projectId"),teacherId:f.get("teacherId"),saleDate:f.get("saleDate"),paymentMethod:f.get("paymentMethod"),status:f.get("status"),renewal:f.get("renewal"),note:f.get("note"),packageHours:hours,defaultHours:Number(f.get("defaultHours")),hourlyRate:rate,paid:Number(f.get("paid"))||hours*rate});save();render()};const tf=document.getElementById("teacherForm");if(tf)tf.onsubmit=e=>{e.preventDefault();const name=String(new FormData(tf).get("name")).trim();if(name)state.teachers.push({id:crypto.randomUUID(),name});save();render()};const rf=document.getElementById("rateForm");if(rf)rf.onsubmit=e=>{e.preventDefault();const f=new FormData(rf),teacherId=f.get("teacherId"),projectId=f.get("projectId"),rate=Number(f.get("rate")),old=state.teacherRates.find(r=>r.teacherId===teacherId&&r.projectId===projectId);if(old)old.rate=rate;else state.teacherRates.push({id:crypto.randomUUID(),teacherId,projectId,rate});save();render()};const bf=document.getElementById("bonusForm");if(bf)bf.onsubmit=e=>{e.preventDefault();const f=new FormData(bf);state.bonuses.unshift({id:crypto.randomUUID(),month:f.get("month"),teacherId:f.get("teacherId"),amount:Number(f.get("amount")),note:f.get("note")});save();render()};const pf=document.getElementById("projectForm");if(pf)pf.onsubmit=e=>{e.preventDefault();const name=String(new FormData(pf).get("name")).trim();if(name)state.projects.push({id:crypto.randomUUID(),name});save();render()};const ef=document.getElementById("expenseForm");if(ef)ef.onsubmit=e=>{e.preventDefault();const f=new FormData(ef);state.expenses.unshift({id:crypto.randomUUID(),date:f.get("date"),projectId:f.get("projectId"),category:f.get("category"),amount:Number(f.get("amount"))});save();render()}}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});render();
</script>

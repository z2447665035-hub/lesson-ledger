<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e8">
  <title>课时与财务</title>
  <style>
    :root{--bg:#f4f0e8;--ink:#171613;--muted:#6f6a5f;--paper:#fffdfa;--sage:#87916f;--sage-dark:#45503a;--clay:#b96f53;--gold:#c7a45b;--blue:#536f86;--shadow:0 18px 46px rgb(45 37 25 / 10%)}*{box-sizing:border-box}body{min-height:100%;margin:0;background:radial-gradient(circle at 18% -8%,rgb(199 164 91 / 22%),transparent 34%),linear-gradient(145deg,#f7f2e9 0%,#ebe3d6 52%,#f6f2ea 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}h1,h2,p{margin:0}.shell{width:min(100%,1180px);min-height:100svh;margin:0 auto;padding:22px 18px 96px}.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;padding:18px 0 16px}.eyebrow{margin:0 0 8px;color:var(--sage-dark);font-size:12px;font-weight:800;text-transform:uppercase}h1{font-size:clamp(32px,8vw,58px);font-weight:760;line-height:.96}h2{font-size:18px;font-weight:780}.subcopy{max-width:560px;margin-top:12px;color:var(--muted);font-size:15px;line-height:1.7}.card,.metric,.panel{border:1px solid rgb(23 22 19 / 10%);border-radius:8px;background:rgb(255 253 250 / 82%);box-shadow:var(--shadow)}.heroMetric{min-width:178px;padding:16px}.muted,.heroMetric span,.metric span,.panelTitle span,.row span,label{color:var(--muted)}.heroMetric strong{display:block;margin-top:6px;color:var(--sage-dark);font-size:25px;line-height:1.1}.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 18px;border:1px solid rgb(23 22 19 / 10%);border-radius:8px;background:rgb(255 253 250 / 76%);padding:6px;backdrop-filter:blur(16px)}.tabs button{min-height:42px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-weight:740}.tabs button.active{background:var(--ink);color:#fffdfa;box-shadow:0 8px 22px rgb(23 22 19 / 16%)}.view{display:grid;gap:14px}.wide{grid-column:1/-1}.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{min-height:104px;padding:17px}.metric span{display:block;font-size:13px;font-weight:680}.metric strong{display:block;margin-top:15px;font-size:clamp(22px,5vw,34px);line-height:1}.panel{padding:16px}.panelTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panelTitle span{flex:0 0 auto;font-size:12px;font-weight:720}.list{display:grid;gap:10px}.row,.quickCard{border:1px solid rgb(23 22 19 / 8%);border-radius:8px;background:rgb(255 255 255 / 62%)}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;min-height:74px;padding:12px}.row strong,.row b{display:block;overflow:hidden;font-size:15px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}.row span{display:block;overflow:hidden;margin-top:4px;font-size:12px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}.rowActions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.iconBtn,.tinyBtn{border:1px solid rgb(23 22 19 / 10%);border-radius:6px;background:#fffdfa;color:var(--ink);font-weight:800}.iconBtn{min-width:34px;height:34px}.tinyBtn{min-height:34px;padding:0 10px}.delete{color:#8d432c}.pill{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:28px;border-radius:999px;font-size:12px;font-style:normal;font-weight:820}.good{background:rgb(135 145 111 / 16%);color:var(--sage-dark)}.soft{background:rgb(83 111 134 / 14%);color:var(--blue)}.warn{background:rgb(185 111 83 / 15%);color:#8d432c}.accent{background:rgb(199 164 91 / 18%);color:#806126}.form{display:grid;gap:12px}label{display:grid;gap:7px;font-size:12px;font-weight:760}input,select{width:100%;min-height:46px;border:1px solid rgb(23 22 19 / 12%);border-radius:7px;background:rgb(255 255 255 / 84%);color:var(--ink);outline:none;padding:0 12px}input:focus,select:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgb(135 145 111 / 18%)}.formSplit{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{min-height:48px;border:0;border-radius:7px;background:var(--sage-dark);color:#fffdfa;font-weight:860;box-shadow:0 12px 26px rgb(69 80 58 / 22%)}.quickGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.quickCard{display:grid;gap:12px;padding:14px}.quickTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.quickTop strong{font-size:16px}.quickTop span,.quickMeta span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.quickBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quickBtns button{min-height:40px;border:0;border-radius:7px;background:var(--ink);color:#fffdfa;font-weight:860}.quickBtns button:nth-child(2){background:var(--sage-dark)}.quickBtns button:nth-child(3){background:#806126}.quickMeta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{height:8px;overflow:hidden;border-radius:999px;background:#e8e1d5}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--sage),var(--gold))}.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:210px;padding-top:8px}.barCol{display:grid;gap:8px;align-items:end;height:100%;text-align:center}.barStick{display:flex;align-items:end;height:156px;border-radius:7px;background:rgb(23 22 19 / 5%);overflow:hidden}.barFill{width:100%;min-height:4px;background:linear-gradient(180deg,var(--sage),var(--gold))}.barCol b{font-size:12px}.barCol span{color:var(--muted);font-size:11px}.rateTags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.rateTags i{border-radius:999px;background:rgb(135 145 111 / 14%);color:var(--sage-dark);font-size:12px;font-style:normal;font-weight:760;padding:6px 9px}@media (min-width:860px){.view{grid-template-columns:.9fr 1.1fr;align-items:start}.tabs{width:620px}}@media (max-width:820px){.shell{padding:18px 14px 92px}.hero{grid-template-columns:1fr}.heroMetric{min-width:0}.statGrid{grid-template-columns:1fr 1fr}.quickGrid{grid-template-columns:1fr}.metric{min-height:94px;padding:14px}.row{grid-template-columns:1fr}.rowActions{justify-content:flex-start}.tabs button{font-size:13px}.chart{gap:6px}}@media (max-width:430px){.formSplit,.statGrid{grid-template-columns:1fr}.quickBtns{grid-template-columns:1fr 1fr 1fr}.tabs button{font-size:12px;padding:0}}
  </style>
</head>
<body>
<main class="shell">
  <section class="hero">
    <div><p class="eyebrow">Lesson Ledger</p><h1>课时与财务</h1><p class="subcopy">学员、老师、项目课时费和利润放在一起，每天点一下就能记清楚。</p></div>
    <div class="card heroMetric"><span>本月净收益</span><strong id="profitHero">¥0</strong></div>
  </section>
  <nav class="tabs"><button class="active" data-tab="overview">看板</button><button data-tab="lesson">记课</button><button data-tab="students">学员</button><button data-tab="teachers">老师</button><button data-tab="finance">财务</button></nav>
  <section id="app"></section>
</main>
<script>
const today=new Date().toISOString().slice(0,10),month=today.slice(0,7);
const labels={attended:"出勤",leave:"请假",absent:"旷课",makeup:"补课"},classes={attended:"good",leave:"soft",absent:"warn",makeup:"accent"};
const seed={projects:[{id:"p1",name:"泰语一对一"},{id:"p2",name:"商务泰语"},{id:"p3",name:"零基础入门"},{id:"p4",name:"考前冲刺"}],teachers:[{id:"t0",name:"我自己"},{id:"t1",name:"老师A"},{id:"t2",name:"老师B"},{id:"t3",name:"老师C"}],teacherRates:[{id:"r0",teacherId:"t0",projectId:"p1",rate:0},{id:"r1",teacherId:"t1",projectId:"p1",rate:120},{id:"r2",teacherId:"t1",projectId:"p2",rate:150},{id:"r3",teacherId:"t2",projectId:"p3",rate:130},{id:"r4",teacherId:"t3",projectId:"p4",rate:100}],students:[{id:"s1",name:"Nina",projectId:"p1",teacherId:"t0",packageHours:30,defaultHours:1.5,hourlyRate:260,paid:7800,saleDate:"2026-08-02"},{id:"s2",name:"Mia",projectId:"p2",teacherId:"t1",packageHours:20,defaultHours:2,hourlyRate:320,paid:6400,saleDate:"2026-08-05"},{id:"s3",name:"Alex",projectId:"p3",teacherId:"t2",packageHours:16,defaultHours:1,hourlyRate:220,paid:3520,saleDate:"2026-07-18"},{id:"s4",name:"Grace",projectId:"p4",teacherId:"t3",packageHours:24,defaultHours:1.5,hourlyRate:280,paid:6720,saleDate:"2026-06-22"}],lessons:[{id:"l1",date:today,studentId:"s1",projectId:"p1",teacherId:"t0",hours:1.5,status:"attended",note:"口语纠音"},{id:"l2",date:today,studentId:"s2",projectId:"p2",teacherId:"t1",hours:2,status:"attended",note:"会议表达"},{id:"l3",date:"2026-08-24",studentId:"s3",projectId:"p3",teacherId:"t2",hours:1,status:"leave",note:"提前请假"},{id:"l4",date:"2026-08-22",studentId:"s1",projectId:"p1",teacherId:"t0",hours:1.5,status:"makeup",note:"补课"},{id:"l5",date:"2026-07-28",studentId:"s4",projectId:"p4",teacherId:"t3",hours:1.5,status:"attended",note:"刷题"}],expenses:[{id:"e1",date:"2026-08-20",projectId:"p1",category:"教材",amount:186},{id:"e2",date:"2026-08-23",projectId:"p2",category:"投放",amount:420},{id:"e3",date:"2026-07-03",projectId:"p3",category:"资料",amount:120}]};
let state=migrate(load("lesson-ledger-v3",null)||load("lesson-ledger-v2",null)||legacy()||seed);
function legacy(){try{const students=JSON.parse(localStorage.getItem("offline.students")),lessons=JSON.parse(localStorage.getItem("offline.lessons")),expenses=JSON.parse(localStorage.getItem("offline.expenses"));if(!students)return null;return{...seed,students,lessons:lessons||[],expenses:expenses||[]}}catch{return null}}
function migrate(d){const projects=d.projects||seed.projects,teachers=(d.teachers||seed.teachers).map(t=>({id:t.id,name:t.name})),pByName=Object.fromEntries(projects.map(p=>[p.name,p.id]));let teacherRates=d.teacherRates;if(!teacherRates){teacherRates=(d.teachers||[]).flatMap(t=>projects.map(p=>({id:crypto.randomUUID(),teacherId:t.id,projectId:p.id,rate:Number(t.rate||0)})));if(!teacherRates.length)teacherRates=seed.teacherRates}return{projects,teachers,teacherRates,students:(d.students||[]).map(s=>({...s,projectId:s.projectId||pByName[s.project]||"p1",teacherId:s.teacherId||"t0",defaultHours:Number(s.defaultHours||1),hourlyRate:Number(s.hourlyRate||s.paid/s.packageHours||0),saleDate:s.saleDate||today})),lessons:(d.lessons||[]).map(l=>({...l,projectId:l.projectId||pByName[l.project]||"p1",teacherId:l.teacherId||d.students?.find(s=>s.id===l.studentId)?.teacherId||"t0"})),expenses:(d.expenses||[]).map(e=>({...e,projectId:e.projectId||pByName[e.project]||"p1"})),tab:"overview"}}
function load(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}function save(){localStorage.setItem("lesson-ledger-v3",JSON.stringify({...state,tab:undefined}))}
const money=v=>new Intl.NumberFormat("zh-CN",{style:"currency",currency:"CNY",maximumFractionDigits:0}).format(v||0),fmt=(v,d=1)=>new Intl.NumberFormat("zh-CN",{maximumFractionDigits:d}).format(v||0);
const maps=()=>({p:Object.fromEntries(state.projects.map(x=>[x.id,x])),t:Object.fromEntries(state.teachers.map(x=>[x.id,x])),s:Object.fromEntries(state.students.map(x=>[x.id,x]))});
function getRate(teacherId,projectId){return Number(state.teacherRates.find(r=>r.teacherId===teacherId&&r.projectId===projectId)?.rate||0)}
function billable(l){return l.status!=="leave"}function fee(l){return billable(l)?l.hours*getRate(l.teacherId,l.projectId):0}
function calc(filterMonth=null){const ls=filterMonth?state.lessons.filter(l=>l.date.startsWith(filterMonth)):state.lessons,ss=filterMonth?state.students.filter(s=>s.saleDate.startsWith(filterMonth)):state.students,es=filterMonth?state.expenses.filter(e=>e.date.startsWith(filterMonth)):state.expenses;const revenue=ss.reduce((a,s)=>a+s.paid,0),hours=ls.filter(billable).reduce((a,l)=>a+l.hours,0),teacher=ls.reduce((a,l)=>a+fee(l),0),expense=es.reduce((a,e)=>a+e.amount,0),bought=state.students.reduce((a,s)=>a+s.packageHours,0),used=state.lessons.filter(billable).reduce((a,l)=>a+l.hours,0);return{revenue,hours,teacher,expense,profit:revenue-teacher-expense,remaining:Math.max(0,bought-used),salesCount:ss.length}}
function metric(a,b){return `<div class="metric"><span>${a}</span><strong>${b}</strong></div>`}function opts(items,val){return items.map(i=>`<option value="${i.id}" ${i.id===val?"selected":""}>${i.name}</option>`).join("")}
function del(type,id){if(!confirm("确定删除这一项吗？"))return;if(type==="student"){state.students=state.students.filter(x=>x.id!==id);state.lessons=state.lessons.filter(x=>x.studentId!==id)}if(type==="lesson")state.lessons=state.lessons.filter(x=>x.id!==id);if(type==="expense")state.expenses=state.expenses.filter(x=>x.id!==id);if(type==="teacher"){state.teachers=state.teachers.filter(x=>x.id!==id);state.teacherRates=state.teacherRates.filter(x=>x.teacherId!==id)}if(type==="project"){state.projects=state.projects.filter(x=>x.id!==id);state.teacherRates=state.teacherRates.filter(x=>x.projectId!==id)}if(type==="rate")state.teacherRates=state.teacherRates.filter(x=>x.id!==id);save();render()}
function addLesson(studentId,hours,status="attended",note="一键记录"){const m=maps(),s=m.s[studentId];if(!s)return;state.lessons.unshift({id:crypto.randomUUID(),date:today,studentId:s.id,projectId:s.projectId,teacherId:s.teacherId,hours:Number(hours),status,note});save();render()}
function row(title,sub,actions=""){return `<div class="row"><div><strong>${title}</strong><span>${sub}</span></div><div class="rowActions">${actions}</div></div>`}
function lessonRow(l){const m=maps(),s=m.s[l.studentId],p=m.p[l.projectId],t=m.t[l.teacherId],rate=getRate(l.teacherId,l.projectId);return row(`${s?.name||"未知学员"} · ${fmt(l.hours)}h`,`${l.date} · ${p?.name||"未分类"} · ${t?.name||"未指定"} · 课时费 ${money(rate)}/h · 成本 ${money(fee(l))}`,`<i class="pill ${classes[l.status]}">${labels[l.status]}</i><button class="iconBtn delete" onclick="del('lesson','${l.id}')">删</button>`)}
function render(){const now=calc(month),all=calc();document.getElementById("profitHero").textContent=money(now.profit);document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));const app=document.getElementById("app");if(state.tab==="overview")overview(app,now,all);if(state.tab==="lesson")lessons(app);if(state.tab==="students")students(app);if(state.tab==="teachers")teachers(app);if(state.tab==="finance")finance(app)}
function overview(app,now,all){app.innerHTML=`<section class="view"><div class="statGrid wide">${metric("本月销售额",money(now.revenue))}${metric("本月课消",fmt(now.hours)+"h")}${metric("本月老师课时费",money(now.teacher))}${metric("剩余课时",fmt(all.remaining)+"h")}</div><section class="panel"><div class="panelTitle"><h2>月度收益</h2><span>近 6 个月</span></div>${chart()}</section><section class="panel"><div class="panelTitle"><h2>今天要记</h2><span>${state.students.length} 名学员</span></div><div class="list">${state.students.slice(0,4).map(quick).join("")}</div></section></section>`}
function quick(s){const m=maps(),p=m.p[s.projectId],t=m.t[s.teacherId],rate=getRate(s.teacherId,s.projectId);return `<div class="quickCard"><div class="quickTop"><div><strong>${s.name}</strong><span>${p?.name||""} · ${t?.name||""} · 课时费 ${money(rate)}/h</span></div><button class="iconBtn delete" onclick="del('student','${s.id}')">删</button></div><div class="quickBtns"><button onclick="addLesson('${s.id}',${s.defaultHours})">上${fmt(s.defaultHours)}h</button><button onclick="addLesson('${s.id}',1)">上1h</button><button onclick="addLesson('${s.id}',${s.defaultHours},'leave','请假')">请假</button></div></div>`}
function lessons(app){app.innerHTML=`<section class="view"><section class="panel wide"><div class="panelTitle"><h2>一键记课</h2><span>按学生的项目和老师自动算课时费</span></div><div class="quickGrid">${state.students.map(quick).join("")}</div></section><form class="panel form" id="lessonForm"><div class="panelTitle"><h2>手动补记</h2><span>适合补录历史课</span></div><label>日期<input name="date" type="date" value="${today}"></label><label>学员<select name="studentId">${opts(state.students,state.students[0]?.id)}</select></label><div class="formSplit"><label>课时<input name="hours" min="0" step="0.5" type="number" value="1"></label><label>考勤<select name="status"><option value="attended">出勤</option><option value="leave">请假</option><option value="absent">旷课</option><option value="makeup">补课</option></select></label></div><label>备注<input name="note" placeholder="第几课、补课、作业反馈"></label><button class="primary">保存记录</button></form><section class="panel"><div class="panelTitle"><h2>最近记录</h2><span>${state.lessons.length} 条</span></div><div class="list">${state.lessons.map(lessonRow).join("")}</div></section></section>`;bind()}
function students(app){const m=maps();const rows=state.students.map(s=>{const used=state.lessons.filter(l=>l.studentId===s.id&&billable(l)).reduce((a,l)=>a+l.hours,0),remain=Math.max(0,s.packageHours-used),cost=state.lessons.filter(l=>l.studentId===s.id).reduce((a,l)=>a+fee(l),0),pct=Math.min(100,used/s.packageHours*100),rate=getRate(s.teacherId,s.projectId);return `<div class="quickCard"><div class="quickTop"><div><strong>${s.name}</strong><span>${m.p[s.projectId]?.name||""} · ${m.t[s.teacherId]?.name||""} · 课时费 ${money(rate)}/h</span></div><button class="iconBtn delete" onclick="del('student','${s.id}')">删</button></div><div class="bar"><i style="width:${pct}%"></i></div><div class="quickMeta"><span>已用 ${fmt(used)}h / 余 ${fmt(remain)}h</span><span>毛利 ${money(s.paid-cost)}</span></div></div>`}).join("");app.innerHTML=`<section class="view"><form class="panel form" id="studentForm"><div class="panelTitle"><h2>新增学员</h2><span>项目 + 老师决定课时费</span></div><label>姓名<input name="name" placeholder="学员姓名"></label><div class="formSplit"><label>项目<select name="projectId">${opts(state.projects,state.projects[0]?.id)}</select></label><label>负责老师<select name="teacherId">${opts(state.teachers,state.teachers[0]?.id)}</select></label></div><div class="formSplit"><label>购买日期<input name="saleDate" type="date" value="${today}"></label><label>默认课时<input name="defaultHours" min="0.5" step="0.5" type="number" value="1"></label></div><div class="formSplit"><label>购买课时<input name="packageHours" min="0" step="0.5" type="number" value="20"></label><label>收费/时<input name="hourlyRate" min="0" type="number" value="260"></label></div><label>总销售额<input name="paid" min="0" type="number" value="5200"></label><button class="primary">添加学员</button></form><section class="panel"><div class="panelTitle"><h2>学员卡片</h2><span>${state.students.length} 人</span></div><div class="list">${rows}</div></section></section>`;bind()}
function teachers(app){const m=maps();const cards=state.teachers.map(t=>{const rates=state.teacherRates.filter(r=>r.teacherId===t.id),ls=state.lessons.filter(l=>l.teacherId===t.id&&billable(l)),hours=ls.reduce((a,l)=>a+l.hours,0),due=ls.reduce((a,l)=>a+fee(l),0),tags=rates.map(r=>`<i>${m.p[r.projectId]?.name||"未分类"} ${money(r.rate)}/h <button class="tinyBtn delete" onclick="del('rate','${r.id}')">删</button></i>`).join("");return `<div class="quickCard"><div class="quickTop"><div><strong>${t.name}</strong><span>已上 ${fmt(hours)}h · 应付 ${money(due)}</span></div><button class="iconBtn delete" onclick="del('teacher','${t.id}')">删</button></div><div class="rateTags">${tags||"<i>还没有项目课时费</i>"}</div></div>`}).join("");app.innerHTML=`<section class="view"><form class="panel form" id="teacherForm"><div class="panelTitle"><h2>新增老师</h2><span>先建老师，再设置项目课时费</span></div><label>老师姓名<input name="name" placeholder="例如：老师D"></label><button class="primary">添加老师</button></form><form class="panel form" id="rateForm"><div class="panelTitle"><h2>设置项目课时费</h2><span>老师 + 项目</span></div><div class="formSplit"><label>老师<select name="teacherId">${opts(state.teachers,state.teachers[0]?.id)}</select></label><label>项目<select name="projectId">${opts(state.projects,state.projects[0]?.id)}</select></label></div><label>课时费/小时<input name="rate" type="number" min="0" value="120"></label><button class="primary">保存课时费</button></form><section class="panel wide"><div class="panelTitle"><h2>老师卡片</h2><span>不同项目不同费用</span></div><div class="list">${cards}</div></section></section>`;bind()}
function finance(app){const now=calc(month);const projectRows=state.projects.map(p=>{const ss=state.students.filter(s=>s.projectId===p.id),ls=state.lessons.filter(l=>l.projectId===p.id&&billable(l)),es=state.expenses.filter(e=>e.projectId===p.id),income=ss.reduce((a,s)=>a+s.paid,0),hours=ls.reduce((a,l)=>a+l.hours,0),teacher=ls.reduce((a,l)=>a+fee(l),0),other=es.reduce((a,e)=>a+e.amount,0);return row(p.name,`总销售 ${money(income)} · 总课消 ${fmt(hours)}h · 老师费 ${money(teacher)} · 支出 ${money(other)}`,`<b>${money(income-teacher-other)}</b><button class="iconBtn delete" onclick="del('project','${p.id}')">删</button>`)}).join("");const expenseRows=state.expenses.map(e=>row(`${maps().p[e.projectId]?.name||""} · ${e.category}`,`${e.date} · ${money(e.amount)}`,`<button class="iconBtn delete" onclick="del('expense','${e.id}')">删</button>`)).join("");app.innerHTML=`<section class="view"><div class="statGrid wide">${metric("项目总销售额",money(calc().revenue))}${metric("总课消",fmt(calc().hours)+"h")}${metric("本月销售额",money(now.revenue))}${metric("本月净收益",money(now.profit))}</div><section class="panel wide"><div class="panelTitle"><h2>项目收益状况</h2><span>销售 - 老师费 - 支出</span></div><div class="list">${projectRows}</div></section><form class="panel form" id="projectForm"><div class="panelTitle"><h2>项目列表</h2><span>新增后下拉可选</span></div><label>项目名称<input name="name" placeholder="例如：旅游泰语"></label><button class="primary">添加项目</button></form><form class="panel form" id="expenseForm"><div class="panelTitle"><h2>记录项目支出</h2><span>会进入利润统计</span></div><div class="formSplit"><label>日期<input name="date" type="date" value="${today}"></label><label>金额<input name="amount" type="number" min="0" value="0"></label></div><label>项目<select name="projectId">${opts(state.projects,state.projects[0]?.id)}</select></label><label>类目<input name="category" value="运营支出"></label><button class="primary">记录支出</button></form><section class="panel"><div class="panelTitle"><h2>支出流水</h2><span>${state.expenses.length} 条</span></div><div class="list">${expenseRows}</div></section></section>`;bind()}
function chart(){const months=[5,4,3,2,1,0].map(n=>{const d=new Date(today.slice(0,4),Number(today.slice(5,7))-1-n,1);return d.toISOString().slice(0,7)}),vals=months.map(m=>calc(m).profit),max=Math.max(1,...vals.map(v=>Math.abs(v)));return `<div class="chart">${months.map((m,i)=>`<div class="barCol"><div class="barStick"><div class="barFill" style="height:${Math.max(4,Math.abs(vals[i])/max*150)}px"></div></div><b>${money(vals[i])}</b><span>${m.slice(5)}月</span></div>`).join("")}</div>`}
function bind(){const lf=document.getElementById("lessonForm");if(lf)lf.onsubmit=e=>{e.preventDefault();const f=new FormData(lf),s=maps().s[f.get("studentId")];state.lessons.unshift({id:crypto.randomUUID(),date:f.get("date"),studentId:s.id,projectId:s.projectId,teacherId:s.teacherId,hours:Number(f.get("hours")),status:f.get("status"),note:f.get("note")});save();render()};const sf=document.getElementById("studentForm");if(sf)sf.onsubmit=e=>{e.preventDefault();const f=new FormData(sf),hours=Number(f.get("packageHours")),rate=Number(f.get("hourlyRate"));state.students.unshift({id:crypto.randomUUID(),name:String(f.get("name")).trim(),projectId:f.get("projectId"),teacherId:f.get("teacherId"),saleDate:f.get("saleDate"),packageHours:hours,defaultHours:Number(f.get("defaultHours")),hourlyRate:rate,paid:Number(f.get("paid"))||hours*rate});save();render()};const tf=document.getElementById("teacherForm");if(tf)tf.onsubmit=e=>{e.preventDefault();const f=new FormData(tf),name=String(f.get("name")).trim();if(name)state.teachers.push({id:crypto.randomUUID(),name});save();render()};const rf=document.getElementById("rateForm");if(rf)rf.onsubmit=e=>{e.preventDefault();const f=new FormData(rf),teacherId=f.get("teacherId"),projectId=f.get("projectId"),rate=Number(f.get("rate")),old=state.teacherRates.find(r=>r.teacherId===teacherId&&r.projectId===projectId);if(old)old.rate=rate;else state.teacherRates.push({id:crypto.randomUUID(),teacherId,projectId,rate});save();render()};const pf=document.getElementById("projectForm");if(pf)pf.onsubmit=e=>{e.preventDefault();const f=new FormData(pf),name=String(f.get("name")).trim();if(name)state.projects.push({id:crypto.randomUUID(),name});save();render()};const ef=document.getElementById("expenseForm");if(ef)ef.onsubmit=e=>{e.preventDefault();const f=new FormData(ef);state.expenses.unshift({id:crypto.randomUUID(),date:f.get("date"),projectId:f.get("projectId"),category:f.get("category"),amount:Number(f.get("amount"))});save();render()}}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});render();
</script>

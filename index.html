function settings(app){const projectRows=state.projects.map(p=>row(p.name,"课程项目 / 报名课程",`<button class="iconBtn delete" onclick="del('project','${p.id}')">删</button>`)).join("");app.innerHTML=`<section class="view"><form class="panel form" id="projectForm"><div class="panelTitle"><h2>课程项目</h2><span>新增后所有下拉可选</span></div><label>项目名称<input name="name" placeholder="例如：泰语发音课"></label><button class="primary">添加项目</button></form><section class="panel"><div class="panelTitle"><h2>项目列表</h2><span>${state.projects.length} 个</span></div><div class="list">${projectRows}</div></section></section>`;bind()}
function salesChart(){const map={};state.monthlySales.forEach(x=>map[x.month]={month:x.month,count:x.count||0,revenue:x.revenue||0});enrollments().forEach(e=>{const m=e.saleDate.slice(0,7);if(!map[m])map[m]={month:m,count:0,revenue:0};if(!seed.monthlySales.some(x=>x.month===m)){map[m].revenue+=Number(e.paid||0);map[m].count+=1}});const rows=Object.values(map).sort((a,b)=>a.month.localeCompare(b.month)).slice(-8),max=Math.max(1,...rows.map(x=>x.revenue));return `<div class="chart">${rows.map(x=>`<div class="barCol"><div class="barStick"><div class="barFill" style="height:${Math.max(4,x.revenue/max*150)}px"></div></div><b>${money(x.revenue)}</b><span>${x.month.slice(5)}月 · ${x.count||""}笔</span></div>`).join("")}</div>`}
function dayGrid(m){const days=new Date(Number(m.slice(0,4)),Number(m.slice(5,7)),0).getDate();let html='<div class="dayGrid">';for(let d=1;d<=days;d++){const date=m+"-"+String(d).padStart(2,"0"),ls=state.lessons.filter(l=>l.date===date),h=ls.filter(billable).reduce((a,l)=>a+l.hours,0);html+=`<div class="dayCell"><b>${d}号</b><span>${fmt(h)}h · ${ls.length}条</span></div>`}return html+"</div>"}
function bind(){const q=document.getElementById("lessonSearch");if(q)q.oninput=e=>{lessonSearch=e.target.value;lesson(document.getElementById("app"));const n=document.getElementById("lessonSearch");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}};const lf=document.getElementById("lessonForm");if(lf)lf.onsubmit=e=>{e.preventDefault();const f=new FormData(lf),en=maps().e[f.get("enrollmentId")];state.lessons.unshift({id:crypto.randomUUID(),date:f.get("date"),studentId:en.studentId,enrollmentId:en.id,projectId:en.projectId,teacherId:en.teacherId,hours:Number(f.get("hours")),status:f.get("status"),note:f.get("note")});save();render()};const sf=document.getElementById("enrollForm");if(sf)sf.onsubmit=e=>{e.preventDefault();const f=new FormData(sf),name=String(f.get("name")).trim();if(!name)return;let s=state.students.find(x=>x.name===name);if(!s){s={id:crypto.randomUUID(),name,region:f.get("region"),reason:f.get("reason"),status:f.get("status"),note:"",enrollments:[]};state.students.unshift(s)}else{s.region=s.region||f.get("region");s.reason=s.reason||f.get("reason");s.status=f.get("status")}const hours=Number(f.get("packageHours")),rate=Number(f.get("hourlyRate"));s.enrollments.push({id:crypto.randomUUID(),projectId:f.get("projectId"),teacherId:f.get("teacherId"),saleDate:f.get("saleDate"),paymentMethod:f.get("paymentMethod"),renewal:f.get("renewal"),note:f.get("note"),packageHours:hours,defaultHours:Number(f.get("defaultHours")),hourlyRate:rate,paid:Number(f.get("paid"))||hours*rate,legacyConsumedHours:0,legacyActualConsumedAmount:0});save();render()};const tf=document.getElementById("teacherForm");if(tf)tf.onsubmit=e=>{e.preventDefault();const name=String(new FormData(tf).get("name")).trim();if(name)state.teachers.push({id:crypto.randomUUID(),name});save();render()};const rf=document.getElementById("rateForm");if(rf)rf.onsubmit=e=>{e.preventDefault();const f=new FormData(rf),teacherId=f.get("teacherId"),projectId=f.get("projectId"),rate=Number(f.get("rate")),old=state.teacherRates.find(r=>r.teacherId===teacherId&&r.projectId===projectId);if(old)old.rate=rate;else state.teacherRates.push({id:crypto.randomUUID(),teacherId,projectId,rate});save();render()};const pf=document.getElementById("projectForm");if(pf)pf.onsubmit=e=>{e.preventDefault();const name=String(new FormData(pf).get("name")).trim();if(name)state.projects.push({id:crypto.randomUUID(),name});save();render()};const ef=document.getElementById("expenseForm");if(ef)ef.onsubmit=e=>{e.preventDefault();const f=new FormData(ef);state.expenses.unshift({id:crypto.randomUUID(),date:f.get("date"),projectId:f.get("projectId"),category:f.get("category"),amount:Number(f.get("amount"))});save();render()}}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});render();
</script>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e8">
  <title>课时与财务</title>
  <style>
    :root{--bg:#f4f0e8;--ink:#171613;--muted:#6f6a5f;--line:#ded6c8;--paper:#fffdfa;--sage:#87916f;--sage-dark:#45503a;--clay:#b96f53;--gold:#c7a45b;--blue:#536f86;--shadow:0 18px 46px rgb(45 37 25 / 10%)}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{min-height:100%;margin:0;background:radial-gradient(circle at 18% -8%,rgb(199 164 91 / 22%),transparent 34%),linear-gradient(145deg,#f7f2e9 0%,#ebe3d6 52%,#f6f2ea 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    button,input,select{font:inherit}button{cursor:pointer}.shell{width:min(100%,1120px);min-height:100svh;margin:0 auto;padding:22px 18px 96px}.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;padding:18px 0 16px}.eyebrow{margin:0 0 8px;color:var(--sage-dark);font-size:12px;font-weight:800;letter-spacing:0;text-transform:uppercase}h1,h2,p{margin:0}h1{font-size:clamp(32px,8vw,58px);font-weight:750;line-height:.96;letter-spacing:0}h2{font-size:18px;font-weight:750}.subcopy{max-width:520px;margin-top:12px;color:var(--muted);font-size:15px;line-height:1.7}.heroMetric,.metric,.panel{border:1px solid rgb(23 22 19 / 10%);border-radius:8px;background:rgb(255 253 250 / 80%);box-shadow:var(--shadow)}.heroMetric{min-width:178px;padding:16px}.heroMetric span,.metric span,.panelTitle span,.studentRow span,.financeRow span,.lessonMain span,.dateBlock span,label{color:var(--muted)}.heroMetric strong{display:block;margin-top:6px;color:var(--sage-dark);font-size:25px;line-height:1.1}
    .tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 18px;border:1px solid rgb(23 22 19 / 10%);border-radius:8px;background:rgb(255 253 250 / 72%);padding:6px;backdrop-filter:blur(16px)}.tabs button{min-height:42px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-weight:700}.tabs button.active{background:var(--ink);color:#fffdfa;box-shadow:0 8px 22px rgb(23 22 19 / 16%)}
    .view{display:grid;gap:14px}.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{min-height:104px;padding:17px}.metric span{display:block;font-size:13px;font-weight:650}.metric strong{display:block;margin-top:15px;font-size:clamp(22px,5vw,34px);line-height:1}.panel{padding:16px}.panelTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panelTitle span{flex:0 0 auto;font-size:12px;font-weight:700}.list{display:grid;gap:10px}.lessonRow,.studentRow,.financeRow{border:1px solid rgb(23 22 19 / 8%);border-radius:8px;background:rgb(255 255 255 / 62%)}
    .lessonRow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:74px;padding:10px}.dateBlock{display:grid;place-items:center;width:48px;height:52px;border-radius:6px;background:#eee8dd}.dateBlock span{font-size:11px;font-weight:800;line-height:1}.dateBlock strong{font-size:20px;line-height:1}.lessonMain,.financeRow>div,.studentRow>div:first-child{min-width:0}.lessonMain strong,.studentRow strong,.financeRow strong,.financeRow b{display:block;overflow:hidden;font-size:15px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}.lessonMain span,.studentRow span,.financeRow span{display:block;overflow:hidden;margin-top:4px;font-size:12px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}.pill{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:28px;border-radius:999px;font-size:12px;font-style:normal;font-weight:800}.good{background:rgb(135 145 111 / 16%);color:var(--sage-dark)}.soft{background:rgb(83 111 134 / 14%);color:var(--blue)}.warn{background:rgb(185 111 83 / 15%);color:#8d432c}.accent{background:rgb(199 164 91 / 18%);color:#806126}
    .form{display:grid;gap:12px}label{display:grid;gap:7px;font-size:12px;font-weight:760}input,select{width:100%;min-height:46px;border:1px solid rgb(23 22 19 / 12%);border-radius:7px;background:rgb(255 255 255 / 82%);color:var(--ink);outline:none;padding:0 12px}input:focus,select:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgb(135 145 111 / 18%)}.formSplit{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{min-height:48px;border:0;border-radius:7px;background:var(--sage-dark);color:#fffdfa;font-weight:850;box-shadow:0 12px 26px rgb(69 80 58 / 22%)}.primary:active{transform:translateY(1px)}
    .studentRow{display:grid;grid-template-columns:minmax(124px,1fr) minmax(96px,210px) auto;gap:12px;align-items:center;min-height:78px;padding:12px}.bar{height:8px;overflow:hidden;border-radius:999px;background:#e8e1d5}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--sage),var(--gold))}.rowMeta{text-align:right}.financeRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;min-height:74px;padding:13px}.financeRow>div:last-child{text-align:right}.financeRow b{color:var(--sage-dark);font-size:17px}
    @media (min-width:820px){.view{grid-template-columns:.9fr 1.1fr;align-items:start}.view>.statGrid{grid-column:1/-1}.tabs{width:520px}}@media (max-width:760px){.shell{padding:18px 14px 92px}.hero{grid-template-columns:1fr}.heroMetric{min-width:0}.statGrid{grid-template-columns:1fr 1fr}.metric{min-height:94px;padding:14px}.studentRow{grid-template-columns:1fr}.rowMeta{display:flex;justify-content:space-between;text-align:left}.financeRow{grid-template-columns:1fr;gap:8px}.financeRow>div:last-child{text-align:left}}@media (max-width:420px){.lessonRow{grid-template-columns:42px minmax(0,1fr)}.dateBlock{width:42px}.pill{grid-column:2;justify-self:start}.formSplit{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div><p class="eyebrow">Lesson Ledger</p><h1>课时与财务</h1><p class="subcopy">记录每一节课，把考勤、课时费和项目利润放在同一张清楚的账里。</p></div>
      <div class="heroMetric"><span>本期利润</span><strong id="profitHero">¥0</strong></div>
    </section>
    <nav class="tabs" aria-label="主要视图">
      <button class="active" data-tab="overview">看板</button><button data-tab="lesson">记课</button><button data-tab="students">学员</button><button data-tab="finance">财务</button>
    </nav>
    <section id="app"></section>
  </main>
  <script>
    const today = new Date().toISOString().slice(0,10);
    const statusLabel={attended:"出勤",leave:"请假",absent:"旷课",makeup:"补课"};
    const statusClass={attended:"good",leave:"soft",absent:"warn",makeup:"accent"};
    const defaults={
      students:[{id:"s1",name:"Nina",project:"泰语一对一",packageHours:30,hourlyRate:260,teacherRate:120,paid:7800},{id:"s2",name:"Mia",project:"商务泰语",packageHours:20,hourlyRate:320,teacherRate:150,paid:6400},{id:"s3",name:"Alex",project:"零基础入门",packageHours:16,hourlyRate:220,teacherRate:100,paid:3520}],
      lessons:[{id:"l1",date:today,studentId:"s1",project:"泰语一对一",hours:1.5,status:"attended",note:"口语纠音"},{id:"l2",date:today,studentId:"s2",project:"商务泰语",hours:2,status:"attended",note:"会议表达"},{id:"l3",date:"2026-08-24",studentId:"s3",project:"零基础入门",hours:1,status:"leave",note:"提前请假，不扣课时"},{id:"l4",date:"2026-08-22",studentId:"s1",project:"泰语一对一",hours:1.5,status:"makeup",note:"补上周课程"}],
      expenses:[{id:"e1",date:"2026-08-20",project:"泰语一对一",category:"教材",amount:186},{id:"e2",date:"2026-08-23",project:"商务泰语",category:"投放",amount:420}]
    };
    let state={tab:"overview",students:load("offline.students",defaults.students),lessons:load("offline.lessons",defaults.lessons),expenses:load("offline.expenses",defaults.expenses)};
    function load(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}
    function save(){localStorage.setItem("offline.students",JSON.stringify(state.students));localStorage.setItem("offline.lessons",JSON.stringify(state.lessons));localStorage.setItem("offline.expenses",JSON.stringify(state.expenses))}
    function money(v){return new Intl.NumberFormat("zh-CN",{style:"currency",currency:"CNY",maximumFractionDigits:0}).format(v)}
    function fmt(v,d=1){return new Intl.NumberFormat("zh-CN",{maximumFractionDigits:d}).format(v)}
    function byId(){return Object.fromEntries(state.students.map(s=>[s.id,s]))}
    function stats(){const map=byId(),bill=state.lessons.filter(l=>l.status!=="leave"),consumed=bill.reduce((s,l)=>s+l.hours,0),revenue=state.students.reduce((s,x)=>s+x.paid,0),teacher=bill.reduce((s,l)=>s+l.hours*(map[l.studentId]?.teacherRate||0),0),expense=state.expenses.reduce((s,x)=>s+x.amount,0),bought=state.students.reduce((s,x)=>s+x.packageHours,0),rate=state.lessons.length?state.lessons.filter(l=>l.status!=="absent").length/state.lessons.length*100:100;return{revenue,consumed,teacher,expense,remaining:Math.max(0,bought-consumed),profit:revenue-teacher-expense,rate,attended:state.lessons.filter(l=>l.status==="attended"||l.status==="makeup").reduce((s,l)=>s+l.hours,0)}}
    function metric(label,value){return `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`}
    function lessonRow(l){const s=byId()[l.studentId];return `<div class="lessonRow"><div class="dateBlock"><span>${l.date.slice(5,7)}</span><strong>${l.date.slice(8,10)}</strong></div><div class="lessonMain"><strong>${s?.name||"未知学员"}</strong><span>${l.project} · ${fmt(l.hours)}h · ${l.note||"无备注"}</span></div><i class="pill ${statusClass[l.status]}">${statusLabel[l.status]}</i></div>`}
    function render(){const st=stats();document.getElementById("profitHero").textContent=money(st.profit);document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));const app=document.getElementById("app");if(state.tab==="overview")app.innerHTML=`<section class="view"><div class="statGrid">${metric("总收入",money(st.revenue))}${metric("已消耗课时",fmt(st.consumed)+"h")}${metric("剩余课时",fmt(st.remaining)+"h")}${metric("考勤率",fmt(st.rate,0)+"%")}</div><section class="panel"><div class="panelTitle"><h2>今日课程</h2><span>${state.lessons.filter(l=>l.date===today).length} 条</span></div><div class="list">${state.lessons.slice(0,5).map(lessonRow).join("")}</div></section></section>`;
    if(state.tab==="lesson")app.innerHTML=`<section class="view"><form class="panel form" id="lessonForm"><div class="panelTitle"><h2>快速记一节课</h2><span>自动同步课时费</span></div><label>日期<input name="date" type="date" value="${today}"></label><label>学员<select name="studentId">${state.students.map(s=>`<option value="${s.id}">${s.name} / ${s.project}</option>`).join("")}</select></label><div class="formSplit"><label>课时<input name="hours" min="0" step="0.5" type="number" value="1"></label><label>考勤<select name="status"><option value="attended">出勤</option><option value="leave">请假</option><option value="absent">旷课</option><option value="makeup">补课</option></select></label></div><label>备注<input name="note" placeholder="例如：第 8 课、补课、作业反馈"></label><button class="primary">记录课程</button></form><section class="panel"><div class="panelTitle"><h2>最近记录</h2><span>${fmt(st.attended)}h 出勤</span></div><div class="list">${state.lessons.map(lessonRow).join("")}</div></section></section>`;
    if(state.tab==="students"){const rows=state.students.map(s=>{const used=state.lessons.filter(l=>l.studentId===s.id&&l.status!=="leave").reduce((a,l)=>a+l.hours,0),remain=Math.max(0,s.packageHours-used),gp=s.paid-used*s.teacherRate,pct=Math.min(100,used/s.packageHours*100);return `<div class="studentRow"><div><strong>${s.name}</strong><span>${s.project}</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="rowMeta"><span>余 ${fmt(remain)}h</span><span>${money(gp)}</span></div></div>`}).join("");app.innerHTML=`<section class="view"><form class="panel form" id="studentForm"><div class="panelTitle"><h2>新增学员</h2><span>购买课时与单价</span></div><label>姓名<input name="name" placeholder="学员姓名"></label><label>项目<input name="project" value="泰语一对一"></label><div class="formSplit"><label>总课时<input name="packageHours" min="0" step="0.5" type="number" value="20"></label><label>收费/时<input name="hourlyRate" min="0" type="number" value="260"></label></div><div class="formSplit"><label>课时费/时<input name="teacherRate" min="0" type="number" value="120"></label><label>已收款<input name="paid" min="0" type="number" value="5200"></label></div><button class="primary">添加学员</button></form><section class="panel"><div class="panelTitle"><h2>学员课时</h2><span>${state.students.length} 人</span></div><div class="list">${rows}</div></section></section>`}
    if(state.tab==="finance"){const projects=[...new Set([...state.students.map(s=>s.project),...state.lessons.map(l=>l.project),...state.expenses.map(e=>e.project)])].map(p=>{const stu=state.students.filter(s=>s.project===p),ls=state.lessons.filter(l=>l.project===p&&l.status!=="leave"),income=stu.reduce((a,s)=>a+s.paid,0),hours=ls.reduce((a,l)=>a+l.hours,0),teacher=ls.reduce((a,l)=>a+l.hours*(byId()[l.studentId]?.teacherRate||0),0),other=state.expenses.filter(e=>e.project===p).reduce((a,e)=>a+e.amount,0);return `<div class="financeRow"><div><strong>${p}</strong><span>${fmt(hours)}h 已消耗</span></div><div><b>${money(income-teacher-other)}</b><span>收 ${money(income)} / 成本 ${money(teacher+other)}</span></div></div>`}).join("");app.innerHTML=`<section class="view"><div class="statGrid">${metric("老师课时费",money(st.teacher))}${metric("其他支出",money(st.expense))}${metric("项目利润",money(st.profit))}${metric("课时负债",fmt(st.remaining)+"h")}</div><form class="panel form" id="expenseForm"><div class="panelTitle"><h2>记录支出</h2><span>教材、投放、运营</span></div><div class="formSplit"><label>日期<input name="date" type="date" value="${today}"></label><label>金额<input name="amount" min="0" type="number" value="0"></label></div><label>项目<input name="project" value="泰语一对一"></label><label>类目<input name="category" value="运营支出"></label><button class="primary">记录支出</button></form><section class="panel"><div class="panelTitle"><h2>项目利润</h2><span>项目汇总</span></div><div class="list">${projects}</div></section></section>`}
    bindForms()}
    function bindForms(){const lf=document.getElementById("lessonForm");if(lf)lf.onsubmit=e=>{e.preventDefault();const f=new FormData(lf),s=byId()[f.get("studentId")];state.lessons.unshift({id:crypto.randomUUID(),date:f.get("date"),studentId:s.id,project:s.project,hours:Number(f.get("hours")),status:f.get("status"),note:f.get("note")});save();render()};const sf=document.getElementById("studentForm");if(sf)sf.onsubmit=e=>{e.preventDefault();const f=new FormData(sf);state.students.unshift({id:crypto.randomUUID(),name:String(f.get("name")).trim(),project:String(f.get("project")).trim()||"默认项目",packageHours:Number(f.get("packageHours")),hourlyRate:Number(f.get("hourlyRate")),teacherRate:Number(f.get("teacherRate")),paid:Number(f.get("paid"))});save();render()};const ef=document.getElementById("expenseForm");if(ef)ef.onsubmit=e=>{e.preventDefault();const f=new FormData(ef);state.expenses.unshift({id:crypto.randomUUID(),date:f.get("date"),project:f.get("project"),category:f.get("category"),amount:Number(f.get("amount"))});save();render()}}
    document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
    render();
  </script>
</body>
</html>

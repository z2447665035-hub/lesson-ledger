const today=new Date().toISOString().slice(0,10),month=today.slice(0,7);
const labels={attended:"出勤",leave:"请假",absent:"旷课",makeup:"补课"},classes={attended:"good",leave:"soft",absent:"warn",makeup:"accent"};
const seed={projects:["基泰一一对一","情景口语一对一","基泰一小班","情景口语小班","录播课","情景口语小班6","情景口语小班3"].map((name,i)=>({id:"p"+(i+1),name})),teachers:["荔枝","小凡","栗子","nana","涛哥"].map((name,i)=>({id:"t"+i,name})),teacherRates:[{id:"r0",teacherId:"t0",projectId:"p1",rate:0},{id:"r1",teacherId:"t0",projectId:"p3",rate:0},{id:"r2",teacherId:"t1",projectId:"p4",rate:120},{id:"r3",teacherId:"t2",projectId:"p1",rate:130},{id:"r4",teacherId:"t2",projectId:"p2",rate:150},{id:"r5",teacherId:"t3",projectId:"p5",rate:80}],students:[{id:"s1",name:"谢同学",region:"四川",reason:"工作",status:"结课学员",note:"",enrollments:[{id:"e1",projectId:"p1",teacherId:"t0",packageHours:20,defaultHours:1,hourlyRate:130,paid:2600,saleDate:"2026-03-04",paymentMethod:"一次付清",renewal:"否",note:"基础泰语一"}]},{id:"s2",name:"蛋蛋",region:"山西",reason:"追星",status:"在读学员",note:"同一学员多阶段示例",enrollments:[{id:"e2",projectId:"p3",teacherId:"t0",packageHours:20,defaultHours:1,hourlyRate:70,paid:1400,saleDate:"2025-09-01",paymentMethod:"上一付一",renewal:"否",note:"基础泰语一"},{id:"e3",projectId:"p4",teacherId:"t0",packageHours:51,defaultHours:1,hourlyRate:100,paid:5100,saleDate:"2025-11-24",paymentMethod:"上一付一",renewal:"是",note:"情景口语续费"}]},{id:"s3",name:"何蕊",region:"",reason:"",status:"在读学员",note:"",enrollments:[{id:"e4",projectId:"p1",teacherId:"t2",packageHours:20,defaultHours:1,hourlyRate:130,paid:2600,saleDate:"2026-05-01",paymentMethod:"一次付清",renewal:"否",note:"栗子授课"}]}],lessons:[{id:"l1",date:today,studentId:"s1",enrollmentId:"e1",projectId:"p1",teacherId:"t0",hours:1,status:"attended",note:"一键记录"},{id:"l2",date:"2025-11-28",studentId:"s2",enrollmentId:"e3",projectId:"p4",teacherId:"t0",hours:1,status:"attended",note:"情景口语"},{id:"l3",date:"2026-06-01",studentId:"s3",enrollmentId:"e4",projectId:"p1",teacherId:"t2",hours:1,status:"attended",note:"基泰一"}],expenses:[{id:"x1",date:"2026-08-20",projectId:"p1",category:"教材",amount:186},{id:"x2",date:"2026-08-23",projectId:"p4",category:"投放",amount:420}],bonuses:[{id:"b1",month:"2026-06",teacherId:"t2",amount:300,note:"续费奖金"}],monthlySales:[["2025-09",13,17846],["2025-10",7,12290],["2025-11",6,10639],["2025-12",2,6300],["2026-01",3,5310],["2026-02",5,7530],["2026-03",21,50670],["2026-04",4,8660],["2026-05",4,7670],["2026-06",13,37930],["2026-07",4,9100]].map(x=>({month:x[0],count:x[1],revenue:x[2]}))};
let state=migrate(load("lesson-ledger-v6",null)||window.LEDGER_IMPORTED_DATA||load("lesson-ledger-v5",null)||load("lesson-ledger-v4",null)||load("lesson-ledger-v3",null)||seed);
function load(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}function save(){localStorage.setItem("lesson-ledger-v6",JSON.stringify({...state,tab:undefined}))}
function migrate(d){const projects=d.projects||seed.projects,teachers=(d.teachers||seed.teachers).map(t=>({id:t.id,name:t.name})),pByName=Object.fromEntries(projects.map(p=>[p.name,p.id]));let teacherRates=d.teacherRates||seed.teacherRates,monthlySales=d.monthlySales||seed.monthlySales,bonuses=d.bonuses||seed.bonuses;let grouped={};(d.students||[]).forEach(s=>{const key=(s.name||"未命名").trim();if(!grouped[key])grouped[key]={id:s.id||crypto.randomUUID(),name:key,region:s.region||"",reason:s.reason||"",status:s.status||"在读学员",note:s.note||"",enrollments:[]};if(s.enrollments){s.enrollments.forEach(e=>grouped[key].enrollments.push({...e,id:e.id||crypto.randomUUID(),projectId:e.projectId||pByName[e.project]||"p1",teacherId:e.teacherId||s.teacherId||"t0",packageHours:Number(e.packageHours||s.packageHours||0),defaultHours:Number(e.defaultHours||s.defaultHours||1),hourlyRate:Number(e.hourlyRate||s.hourlyRate||0),paid:Number(e.paid||s.paid||0),saleDate:e.saleDate||s.saleDate||today,paymentMethod:e.paymentMethod||s.paymentMethod||"一次付清",renewal:e.renewal||s.renewal||"否",note:e.note||s.note||""}))}else{grouped[key].enrollments.push({id:crypto.randomUUID(),projectId:s.projectId||pByName[s.project]||"p1",teacherId:s.teacherId||"t0",packageHours:Number(s.packageHours||0),defaultHours:Number(s.defaultHours||1),hourlyRate:Number(s.hourlyRate||0),paid:Number(s.paid||0),saleDate:s.saleDate||today,paymentMethod:s.paymentMethod||"一次付清",renewal:s.renewal||"否",note:s.note||""})}});const students=Object.values(grouped);let eByOld={};students.forEach(s=>s.enrollments.forEach(e=>{eByOld[s.id]=e.id}));const lessons=(d.lessons||[]).map(l=>{const s=students.find(x=>x.id===l.studentId)||students.find(x=>x.name===l.studentName),e=s?.enrollments.find(x=>x.id===l.enrollmentId)||s?.enrollments.find(x=>x.projectId===(l.projectId||pByName[l.project]))||s?.enrollments[0];return{...l,id:l.id||crypto.randomUUID(),studentId:s?.id||l.studentId,enrollmentId:e?.id||l.enrollmentId,projectId:e?.projectId||l.projectId||"p1",teacherId:e?.teacherId||l.teacherId||"t0"}});return{projects,teachers,teacherRates,monthlySales,bonuses,students,lessons,expenses:(d.expenses||seed.expenses).map(e=>({...e,projectId:e.projectId||pByName[e.project]||"p1"})),tab:"overview"}}
const money=v=>new Intl.NumberFormat("zh-CN",{style:"currency",currency:"CNY",maximumFractionDigits:0}).format(v||0),fmt=(v,d=1)=>new Intl.NumberFormat("zh-CN",{maximumFractionDigits:d}).format(v||0);
const maps=()=>({p:Object.fromEntries(state.projects.map(x=>[x.id,x])),t:Object.fromEntries(state.teachers.map(x=>[x.id,x])),s:Object.fromEntries(state.students.map(x=>[x.id,x])),e:Object.fromEntries(state.students.flatMap(s=>s.enrollments.map(e=>[e.id,{...e,studentId:s.id,studentName:s.name}])))});function getRate(t,p){return Number(state.teacherRates.find(r=>r.teacherId===t&&r.projectId===p)?.rate||0)}function billable(l){return l.status!=="leave"}function fee(l){return billable(l)?l.hours*getRate(l.teacherId,l.projectId):0}
function enrollments(){return state.students.flatMap(s=>s.enrollments.map(e=>({...e,studentId:s.id,studentName:s.name,region:s.region,reason:s.reason,status:s.status})))}
function actualAmount(ls){const e=maps().e;return ls.filter(billable).reduce((a,l)=>a+(e[l.enrollmentId]?.hourlyRate||0)*l.hours,0)}
function calc(m=null){const es=enrollments().filter(e=>!m||e.saleDate.startsWith(m)),ls=state.lessons.filter(l=>!m||l.date.startsWith(m)),xs=state.expenses.filter(e=>!m||e.date.startsWith(m)),bs=state.bonuses.filter(b=>!m||b.month===m);const revenue=es.reduce((a,e)=>a+Number(e.paid||0),0),hours=ls.filter(billable).reduce((a,l)=>a+l.hours,0),actual=actualAmount(ls),teacher=ls.reduce((a,l)=>a+fee(l),0),expense=xs.reduce((a,e)=>a+e.amount,0),bonus=bs.reduce((a,b)=>a+b.amount,0),bought=enrollments().reduce((a,e)=>a+Number(e.packageHours||0),0),used=state.lessons.filter(billable).reduce((a,l)=>a+l.hours,0);return{revenue,hours,actual,teacher,expense,bonus,profit:revenue-teacher-expense-bonus,remaining:Math.max(0,bought-used),count:es.length}}
function metric(a,b){return `<div class="metric"><span>${a}</span><strong>${b}</strong></div>`}function opts(items,val){return items.map(i=>`<option value="${i.id}" ${i.id===val?"selected":""}>${i.name}</option>`).join("")}function optText(items,val){return items.map(i=>`<option ${i===val?"selected":""}>${i}</option>`).join("")}
function del(type,id){if(!confirm("确定删除这一项吗？"))return;if(type==="student"){state.students=state.students.filter(x=>x.id!==id);state.lessons=state.lessons.filter(x=>x.studentId!==id)}if(type==="enrollment"){state.students.forEach(s=>s.enrollments=s.enrollments.filter(e=>e.id!==id));state.lessons=state.lessons.filter(l=>l.enrollmentId!==id)}if(type==="lesson")state.lessons=state.lessons.filter(x=>x.id!==id);if(type==="expense")state.expenses=state.expenses.filter(x=>x.id!==id);if(type==="bonus")state.bonuses=state.bonuses.filter(x=>x.id!==id);if(type==="teacher"){state.teachers=state.teachers.filter(x=>x.id!==id);state.teacherRates=state.teacherRates.filter(x=>x.teacherId!==id)}if(type==="project"){state.projects=state.projects.filter(x=>x.id!==id);state.teacherRates=state.teacherRates.filter(x=>x.projectId!==id)}if(type==="rate")state.teacherRates=state.teacherRates.filter(x=>x.id!==id);save();render()}
function addLesson(studentId,enrollmentId,hours,status="attended",note="一键记录"){const m=maps(),e=m.e[enrollmentId];if(!e)return;state.lessons.unshift({id:crypto.randomUUID(),date:today,studentId,enrollmentId:e.id,projectId:e.projectId,teacherId:e.teacherId,hours:Number(hours),status,note});save();render()}
function row(title,sub,actions=""){return `<div class="row"><div><strong>${title}</strong><span>${sub}</span></div><div class="rowActions">${actions}</div></div>`}
function render(){const now=calc(month);document.getElementById("profitHero").textContent=money(now.profit);document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));({overview,lesson,students,teachers,finance,settings}[state.tab]||overview)(document.getElementById("app"))}
function overview(app){const now=calc(month),all=calc();app.innerHTML=`<section class="view"><div class="statGrid wide">${metric("本月销售额",money(now.revenue))}${metric("本月实际课消金额",money(now.actual))}${metric("本月课消",fmt(now.hours)+"h")}${metric("剩余课时",fmt(all.remaining)+"h")}</div><section class="panel wide"><div class="panelTitle"><h2>月度销售额</h2><span>每笔报名按付款日期归月</span></div>${salesChart()}</section><section class="panel"><div class="panelTitle"><h2>快捷考勤</h2><span>不按固定星期，谁上完点谁</span></div><div class="list">${state.students.filter(s=>s.status==="在读学员").slice(0,6).map(quick).join("")}</div></section><section class="panel"><div class="panelTitle"><h2>本月课消日历</h2><span>${fmt(now.hours)}h / ${money(now.actual)}</span></div>${dayGrid(month)}</section></section>`}
function quick(s){const m=maps();return `<div class="quickCard"><div class="quickTop"><div><strong>${s.name}</strong><span>${s.status} · ${s.region||"未填地区"} · ${s.reason||"未填原因"}</span></div><button class="iconBtn delete" onclick="del('student','${s.id}')">删</button></div><div class="enrollList">${s.enrollments.map(e=>{const p=m.p[e.projectId],t=m.t[e.teacherId],rate=getRate(e.teacherId,e.projectId);return `<div class="enroll"><div class="enrollHead"><strong>${p?.name||"课程"}</strong><span>${e.renewal==="是"?"续费":"首报"} · ${e.saleDate}</span></div><p>${t?.name||""} · 学费 ${money(e.paid)} · 老师费 ${money(rate)}/h</p><div class="quickBtns"><button onclick="addLesson('${s.id}','${e.id}',${e.defaultHours})">默认${fmt(e.defaultHours)}h</button><button onclick="addLesson('${s.id}','${e.id}',1)">1h</button><button onclick="addLesson('${s.id}','${e.id}',${e.defaultHours},'makeup','补课')">补课</button><button onclick="addLesson('${s.id}','${e.id}',${e.defaultHours},'leave','请假')">请假</button></div></div>`}).join("")}</div></div>`}
function lesson(app){app.innerHTML=`<section class="view"><section class="panel wide"><div class="panelTitle"><h2>一键考勤</h2><span>先选学员卡里的某一笔课程</span></div><div class="quickGrid">${state.students.map(quick).join("")}</div></section><form class="panel form" id="lessonForm"><div class="panelTitle"><h2>补录历史课</h2><span>选择具体报名记录</span></div><label>报名记录<select name="enrollmentId">${enrollments().map(e=>`<option value="${e.id}">${e.studentName} / ${maps().p[e.projectId]?.name||""} / ${e.saleDate}</option>`).join("")}</select></label><div class="formSplit"><label>日期<input name="date" type="date" value="${today}"></label><label>课时<input name="hours" min="0" step="0.5" type="number" value="1"></label></div><label>考勤<select name="status"><option value="attended">出勤</option><option value="leave">请假</option><option value="absent">旷课</option><option value="makeup">补课</option></select></label><label>备注<input name="note" placeholder="第几课、补课、作业反馈"></label><button class="primary">保存记录</button></form><section class="panel"><div class="panelTitle"><h2>最近记录</h2><span>${state.lessons.length} 条</span></div><div class="list">${state.lessons.map(lessonRow).join("")}</div></section></section>`;bind()}
function lessonRow(l){const m=maps(),e=m.e[l.enrollmentId],p=m.p[l.projectId],t=m.t[l.teacherId],rate=getRate(l.teacherId,l.projectId);return row(`${e?.studentName||"未知学员"} · ${fmt(l.hours)}h`,`${l.date} · ${p?.name||"未分类"} · ${t?.name||"未指定"} · 成本 ${money(fee(l))} (${money(rate)}/h)`,`<i class="pill ${classes[l.status]}">${labels[l.status]}</i><button class="iconBtn delete" onclick="del('lesson','${l.id}')">删</button>`)}
function students(app){const m=maps();app.innerHTML=`<section class="view"><form class="panel form" id="enrollForm"><div class="panelTitle"><h2>新增报名 / 续费</h2><span>同名学员自动合并到同一张卡</span></div><label>客户名称<input name="name" placeholder="学员姓名，和旧学员同名即追加续费"></label><div class="formSplit"><label>地区<input name="region" placeholder="北京 / 四川成都"></label><label>学习原因<select name="reason">${optText(["追星","旅行/生活","工作","其他"],"追星")}</select></label></div><div class="formSplit"><label>报名课程<select name="projectId">${opts(state.projects,state.projects[0]?.id)}</select></label><label>授课老师<select name="teacherId">${opts(state.teachers,state.teachers[0]?.id)}</select></label></div><div class="formTri"><label>付款日期<input name="saleDate" type="date" value="${today}"></label><label>付款方式<select name="paymentMethod">${optText(["一次付清","上一付一"],"一次付清")}</select></label><label>状态<select name="status">${optText(["在读学员","结课学员","潜在学员","休眠学员"],"在读学员")}</select></label></div><div class="formTri"><label>课时单价<input name="hourlyRate" min="0" type="number" value="130"></label><label>购买课时<input name="packageHours" min="0" step="0.5" type="number" value="20"></label><label>默认课时<input name="defaultHours" min="0.5" step="0.5" type="number" value="1"></label></div><div class="formSplit"><label>销售额<input name="paid" min="0" type="number" value="2600"></label><label>是否续费<select name="renewal">${optText(["否","是"],"否")}</select></label></div><label>备注<input name="note" placeholder="例如：第二阶段情景口语"></label><button class="primary">保存到学员卡</button></form><section class="panel"><div class="panelTitle"><h2>学员卡片</h2><span>${state.students.length} 人 / ${enrollments().length} 笔报名</span></div><div class="list">${state.students.map(studentCard).join("")}</div></section></section>`;bind()}
function studentCard(s){const m=maps(),total=s.enrollments.reduce((a,e)=>a+Number(e.paid||0),0),bought=s.enrollments.reduce((a,e)=>a+Number(e.packageHours||0),0),studentLessons=state.lessons.filter(l=>l.studentId===s.id),used=studentLessons.filter(billable).reduce((a,l)=>a+l.hours,0),actual=actualAmount(studentLessons),cost=studentLessons.reduce((a,l)=>a+fee(l),0),pct=Math.min(100,used/Math.max(1,bought)*100);return `<div class="quickCard"><div class="quickTop"><div><strong>${s.name}</strong><span>${s.status} · ${s.region||"未填地区"} · ${s.reason||"未填原因"}</span></div><button class="iconBtn delete" onclick="del('student','${s.id}')">删</button></div><div class="bar"><i style="width:${pct}%"></i></div><div class="quickMeta"><span>总销售 ${money(total)} / ${s.enrollments.length} 笔报名</span><span>已用 ${fmt(used)}h / 余 ${fmt(Math.max(0,bought-used))}h</span><span>实际课消 ${money(actual)}</span><span>毛利 ${money(total-cost)}</span></div><div class="enrollList">${s.enrollments.map(e=>`<div class="enroll"><div class="enrollHead"><strong>${m.p[e.projectId]?.name||""}</strong><span>${e.renewal==="是"?"续费":"首报"} · ${e.saleDate}</span></div><p>${m.t[e.teacherId]?.name||""} · ${money(e.paid)} · ${e.packageHours}h · ${e.paymentMethod} <button class="tinyBtn delete" onclick="del('enrollment','${e.id}')">删</button></p></div>`).join("")}</div></div>`}
function teachers(app){const m=maps();const cards=state.teachers.map(t=>{const rates=state.teacherRates.filter(r=>r.teacherId===t.id),ls=state.lessons.filter(l=>l.teacherId===t.id&&billable(l)),hours=ls.reduce((a,l)=>a+l.hours,0),due=ls.reduce((a,l)=>a+fee(l),0),bonus=state.bonuses.filter(b=>b.teacherId===t.id).reduce((a,b)=>a+b.amount,0),tags=rates.map(r=>`<i>${m.p[r.projectId]?.name||"未分类"} ${money(r.rate)}/h <button class="tinyBtn delete" onclick="del('rate','${r.id}')">删</button></i>`).join("");return `<div class="quickCard"><div class="quickTop"><div><strong>${t.name}</strong><span>已上 ${fmt(hours)}h · 课时费 ${money(due)} · 奖金 ${money(bonus)}</span></div><button class="iconBtn delete" onclick="del('teacher','${t.id}')">删</button></div><div class="rateTags">${tags||"<i>还没有项目课时费</i>"}</div></div>`}).join("");app.innerHTML=`<section class="view"><form class="panel form" id="teacherForm"><div class="panelTitle"><h2>新增老师</h2><span>老师姓名</span></div><label>老师姓名<input name="name" placeholder="例如：新老师"></label><button class="primary">添加老师</button></form><form class="panel form" id="rateForm"><div class="panelTitle"><h2>项目课时费</h2><span>老师 + 课程项目</span></div><div class="formSplit"><label>老师<select name="teacherId">${opts(state.teachers,state.teachers[0]?.id)}</select></label><label>报名课程<select name="projectId">${opts(state.projects,state.projects[0]?.id)}</select></label></div><label>教师单节课时费<input name="rate" type="number" min="0" value="120"></label><button class="primary">保存课时费</button></form><form class="panel form" id="bonusForm"><div class="panelTitle"><h2>奖金统计</h2><span>会计入成本</span></div><div class="formSplit"><label>月份<input name="month" type="month" value="${month}"></label><label>教师<select name="teacherId">${opts(state.teachers,state.teachers[0]?.id)}</select></label></div><label>金额<input name="amount" type="number" min="0" value="300"></label><label>备注<input name="note" placeholder="例如：续费奖金"></label><button class="primary">添加奖金</button></form><section class="panel wide"><div class="panelTitle"><h2>老师卡片</h2><span>不同课程不同费用</span></div><div class="list">${cards}</div></section></section>`;bind()}
function finance(app){const now=calc(month),all=calc(),m=maps();const projectRows=state.projects.map(p=>{const es=enrollments().filter(e=>e.projectId===p.id),ls=state.lessons.filter(l=>l.projectId===p.id&&billable(l)),xs=state.expenses.filter(e=>e.projectId===p.id),income=es.reduce((a,e)=>a+e.paid,0),actual=actualAmount(ls),hours=ls.reduce((a,l)=>a+l.hours,0),teacher=ls.reduce((a,l)=>a+fee(l),0),other=xs.reduce((a,e)=>a+e.amount,0);return row(p.name,`项目总销售 ${money(income)} · 实际课消金额 ${money(actual)} · 总课消 ${fmt(hours)}h · 老师费 ${money(teacher)} · 支出 ${money(other)}`,`<b>${money(income-teacher-other)}</b><button class="iconBtn delete" onclick="del('project','${p.id}')">删</button>`)}).join("");const bonusRows=state.bonuses.map(b=>row(`${b.month} · ${m.t[b.teacherId]?.name||""}`,`${money(b.amount)} · ${b.note||"奖金"}`,`<button class="iconBtn delete" onclick="del('bonus','${b.id}')">删</button>`)).join("");app.innerHTML=`<section class="view"><div class="statGrid wide">${metric("项目总销售额",money(all.revenue))}${metric("实际课消金额",money(all.actual))}${metric("总课消",fmt(all.hours)+"h")}${metric("本月净收益",money(now.profit))}</div><section class="panel wide"><div class="panelTitle"><h2>项目收益状况</h2><span>每笔报名归属对应项目</span></div><div class="list">${projectRows}</div></section><section class="panel"><div class="panelTitle"><h2>奖金流水</h2><span>${state.bonuses.length} 条</span></div><div class="list">${bonusRows}</div></section><form class="panel form" id="expenseForm"><div class="panelTitle"><h2>记录项目支出</h2><span>教材、投放、资料</span></div><div class="formSplit"><label>日期<input name="date" type="date" value="${today}"></label><label>金额<input name="amount" type="number" min="0" value="0"></label></div><label>项目<select name="projectId">${opts(state.projects,state.projects[0]?.id)}</select></label><label>类目<input name="category" value="运营支出"></label><button class="primary">记录支出</button></form></section>`;bind()}
function settings(app){const projectRows=state.projects.map(p=>row(p.name,"课程项目 / 报名课程",`<button class="iconBtn delete" onclick="del('project','${p.id}')">删</button>`)).join("");app.innerHTML=`<section class="view"><form class="panel form" id="projectForm"><div class="panelTitle"><h2>课程项目</h2><span>新增后所有下拉可选</span></div><label>项目名称<input name="name" placeholder="例如：泰语发音课"></label><button class="primary">添加项目</button></form><section class="panel"><div class="panelTitle"><h2>项目列表</h2><span>${state.projects.length} 个</span></div><div class="list">${projectRows}</div></section></section>`;bind()}
function salesChart(){const map={};state.monthlySales.forEach(x=>map[x.month]={month:x.month,count:x.count||0,revenue:x.revenue||0});enrollments().forEach(e=>{const m=e.saleDate.slice(0,7);if(!map[m])map[m]={month:m,count:0,revenue:0};if(!seed.monthlySales.some(x=>x.month===m)){map[m].revenue+=Number(e.paid||0);map[m].count+=1}});const rows=Object.values(map).sort((a,b)=>a.month.localeCompare(b.month)).slice(-8),max=Math.max(1,...rows.map(x=>x.revenue));return `<div class="chart">${rows.map(x=>`<div class="barCol"><div class="barStick"><div class="barFill" style="height:${Math.max(4,x.revenue/max*150)}px"></div></div><b>${money(x.revenue)}</b><span>${x.month.slice(5)}月 · ${x.count||""}笔</span></div>`).join("")}</div>`}
function dayGrid(m){const days=new Date(Number(m.slice(0,4)),Number(m.slice(5,7)),0).getDate();let html='<div class="dayGrid">';for(let d=1;d<=days;d++){const date=m+"-"+String(d).padStart(2,"0"),ls=state.lessons.filter(l=>l.date===date),h=ls.filter(billable).reduce((a,l)=>a+l.hours,0);html+=`<div class="dayCell"><b>${d}号</b><span>${fmt(h)}h · ${ls.length}条</span></div>`}return html+"</div>"}
function bind(){const lf=document.getElementById("lessonForm");if(lf)lf.onsubmit=e=>{e.preventDefault();const f=new FormData(lf),en=maps().e[f.get("enrollmentId")];state.lessons.unshift({id:crypto.randomUUID(),date:f.get("date"),studentId:en.studentId,enrollmentId:en.id,projectId:en.projectId,teacherId:en.teacherId,hours:Number(f.get("hours")),status:f.get("status"),note:f.get("note")});save();render()};const sf=document.getElementById("enrollForm");if(sf)sf.onsubmit=e=>{e.preventDefault();const f=new FormData(sf),name=String(f.get("name")).trim();if(!name)return;let s=state.students.find(x=>x.name===name);if(!s){s={id:crypto.randomUUID(),name,region:f.get("region"),reason:f.get("reason"),status:f.get("status"),note:"",enrollments:[]};state.students.unshift(s)}else{s.region=s.region||f.get("region");s.reason=s.reason||f.get("reason");s.status=f.get("status")}const hours=Number(f.get("packageHours")),rate=Number(f.get("hourlyRate"));s.enrollments.push({id:crypto.randomUUID(),projectId:f.get("projectId"),teacherId:f.get("teacherId"),saleDate:f.get("saleDate"),paymentMethod:f.get("paymentMethod"),renewal:f.get("renewal"),note:f.get("note"),packageHours:hours,defaultHours:Number(f.get("defaultHours")),hourlyRate:rate,paid:Number(f.get("paid"))||hours*rate});save();render()};const tf=document.getElementById("teacherForm");if(tf)tf.onsubmit=e=>{e.preventDefault();const name=String(new FormData(tf).get("name")).trim();if(name)state.teachers.push({id:crypto.randomUUID(),name});save();render()};const rf=document.getElementById("rateForm");if(rf)rf.onsubmit=e=>{e.preventDefault();const f=new FormData(rf),teacherId=f.get("teacherId"),projectId=f.get("projectId"),rate=Number(f.get("rate")),old=state.teacherRates.find(r=>r.teacherId===teacherId&&r.projectId===projectId);if(old)old.rate=rate;else state.teacherRates.push({id:crypto.randomUUID(),teacherId,projectId,rate});save();render()};const bf=document.getElementById("bonusForm");if(bf)bf.onsubmit=e=>{e.preventDefault();const f=new FormData(bf);state.bonuses.unshift({id:crypto.randomUUID(),month:f.get("month"),teacherId:f.get("teacherId"),amount:Number(f.get("amount")),note:f.get("note")});save();render()};const pf=document.getElementById("projectForm");if(pf)pf.onsubmit=e=>{e.preventDefault();const name=String(new FormData(pf).get("name")).trim();if(name)state.projects.push({id:crypto.randomUUID(),name});save();render()};const ef=document.getElementById("expenseForm");if(ef)ef.onsubmit=e=>{e.preventDefault();const f=new FormData(ef);state.expenses.unshift({id:crypto.randomUUID(),date:f.get("date"),projectId:f.get("projectId"),category:f.get("category"),amount:Number(f.get("amount"))});save();render()}}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});render();
</script>

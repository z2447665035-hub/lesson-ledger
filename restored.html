<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课时与财务 - 修复版</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f0e8;color:#171613;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}main{width:min(92vw,520px);border:1px solid rgb(23 22 19 / 12%);border-radius:8px;background:#fffdfa;padding:24px;box-shadow:0 18px 46px rgb(45 37 25 / 10%)}h1{margin:0 0 10px;font-size:26px}p{color:#6f6a5f;line-height:1.7}.err{color:#8d432c}</style>
</head>
<body>
<main><h1>正在恢复课时与财务...</h1><p>正在载入完整学员数据并应用联动修复。</p></main>
<script>
const css='.actionHint{color:var(--muted);font-size:11px}.quickCard,.row,.enroll,.rateTags i{transition:border-color 120ms ease,transform 120ms ease,box-shadow 120ms ease}.quickCard:hover,.row:hover,.enroll:hover{border-color:rgb(69 80 58 / 24%);box-shadow:0 12px 30px rgb(45 37 25 / 9%)}.modalShade{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgb(23 22 19 / 34%);padding:18px;backdrop-filter:blur(10px)}.modalBox{width:min(100%,420px);border:1px solid rgb(23 22 19 / 12%);border-radius:8px;background:#fffdfa;box-shadow:0 24px 70px rgb(23 22 19 / 22%);padding:16px}.modalBox h2{font-size:20px}.modalBox p{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.6}.modalActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.modalActions button{min-height:42px;border:1px solid rgb(23 22 19 / 12%);border-radius:7px;background:#f7f2e9;font-weight:780}.modalActions .danger{background:#fff2ed;color:#8d432c}.quickBtns.pair{grid-template-columns:1fr 1fr}.quickBtns .minus{background:linear-gradient(180deg,#9c4c32,#8d432c)}';
const patch=`
function lessonHoursForEnrollment(id){return state.lessons.filter(l=>l.enrollmentId===id&&billable(l)).reduce((a,l)=>a+Number(l.hours||0),0)}
function consumedHours(e){return Number(e.legacyConsumedHours||0)+lessonHoursForEnrollment(e.id)}
function consumedActual(e){return consumedHours(e)*Number(e.hourlyRate||0)}
sourceHours=function(es=enrollments()){return es.reduce((a,e)=>a+consumedHours(e),0)};
sourceActual=function(es=enrollments()){return es.reduce((a,e)=>a+consumedActual(e),0)};
sourceTeacherFee=function(es=enrollments()){return es.reduce((a,e)=>a+consumedHours(e)*getRate(e.teacherId,e.projectId),0)};
actualAmount=function(ls){const e=maps().e;return ls.filter(billable).reduce((a,l)=>a+Number(e[l.enrollmentId]?.hourlyRate||0)*Number(l.hours||0),0)};
function openMenu(title,subtitle,onEdit,onDelete){document.querySelector('.modalShade')?.remove();const shade=document.createElement('div');shade.className='modalShade';shade.innerHTML='<div class="modalBox"><h2>'+title+'</h2><p>'+subtitle+'</p><div class="modalActions"><button data-act="edit">修改资料</button><button class="danger" data-act="delete">删除记录</button></div></div>';shade.onclick=e=>{if(e.target===shade)shade.remove()};shade.querySelector('[data-act="edit"]').onclick=()=>{shade.remove();onEdit()};shade.querySelector('[data-act="delete"]').onclick=()=>{shade.remove();onDelete()};document.body.appendChild(shade)}
function menu(type,id,title,subtitle,editFn){openMenu(title,subtitle,editFn,()=>del(type,id))}
function minusLesson(enrollmentId){const e=maps().e[enrollmentId];if(!e)return;const idx=state.lessons.findIndex(l=>l.enrollmentId===enrollmentId&&billable(l));if(idx>=0){state.lessons.splice(idx,1)}else{const step=Number(e.defaultHours||1);state.students.forEach(s=>s.enrollments.forEach(x=>{if(x.id===enrollmentId){x.legacyConsumedHours=Math.max(0,Number(x.legacyConsumedHours||0)-step);x.legacyActualConsumedAmount=x.legacyConsumedHours*Number(x.hourlyRate||0)}}))}save();render()}
editEnrollment=function(id){const m=maps();let target,student;state.students.forEach(s=>s.enrollments.forEach(e=>{if(e.id===id){target=e;student=s}}));if(!target)return;const projectName=ask('报名课程',m.p[target.projectId]?.name||''),teacherName=ask('授课老师',m.t[target.teacherId]?.name||''),project=state.projects.find(p=>p.name===projectName)||state.projects.find(p=>p.id===target.projectId),teacher=state.teachers.find(t=>t.name===teacherName)||state.teachers.find(t=>t.id===target.teacherId);if(project)target.projectId=project.id;if(teacher)target.teacherId=teacher.id;target.saleDate=ask('付款日期',target.saleDate);target.paymentMethod=ask('付款方式',target.paymentMethod);target.renewal=ask('是否续费：是 / 否',target.renewal);target.packageHours=Number(ask('购买课时',target.packageHours))||0;target.defaultHours=Number(ask('单节时长',target.defaultHours))||1;target.hourlyRate=Number(ask('课时单价',target.hourlyRate))||0;const suggested=target.packageHours*target.hourlyRate;target.paid=Number(ask('销售额（默认=购买课时×课时单价）',target.paid||suggested))||suggested;target.legacyConsumedHours=Number(ask('历史已消课时',target.legacyConsumedHours||0))||0;target.legacyActualConsumedAmount=target.legacyConsumedHours*target.hourlyRate;target.note=ask('备注',target.note);if(student)student.status=student.status||'在读学员';save();render()};
row=function(title,sub,actions='',dbl=''){return '<div class="row" '+dbl+'><div><strong>'+title+'</strong><span>'+sub+'</span></div><div class="rowActions">'+actions+'</div></div>'};
projectRows=function(){return state.projects.map(p=>{const es=enrollments().filter(e=>e.projectId===p.id),ls=state.lessons.filter(l=>l.projectId===p.id&&billable(l)&&l.date.startsWith(month)),xs=state.expenses.filter(e=>e.projectId===p.id),income=es.reduce((a,e)=>a+Number(e.paid||0),0),actual=sourceActual(es),hours=sourceHours(es),teacher=sourceTeacherFee(es),monthActual=actualAmount(ls),monthHours=ls.reduce((a,l)=>a+Number(l.hours||0),0),other=xs.reduce((a,e)=>a+e.amount,0);return row(p.name,'总销售 '+money(income)+' · 实际课消 '+money(actual)+' / '+fmt(hours)+'课时 · 本月课消 '+money(monthActual)+' / '+fmt(monthHours)+'课时 · 老师费 '+money(teacher)+' · 支出 '+money(other),'<b>'+money(income-teacher-other)+'</b>','ondblclick="menu(\\'project\\',\\''+p.id+'\\',\\''+p.name+'\\',\\'项目操作\\',()=>editProject(\\''+p.id+'\\'))"')}).join('')};
quick=function(s){const m=maps();return '<div class="quickCard" ondblclick="menu(\\'student\\',\\''+s.id+'\\',\\''+s.name+'\\',\\'学员卡片操作\\',()=>editStudent(\\''+s.id+'\\'))"><div class="quickTop"><div><strong>'+s.name+'</strong><span>'+s.status+' · '+(s.region||'未填地区')+' · '+(s.reason||'未填原因')+'</span></div><span class="actionHint">双击管理</span></div><div class="enrollList">'+s.enrollments.map(e=>{const p=m.p[e.projectId],t=m.t[e.teacherId],times=consumedHours(e);return '<div class="enroll" ondblclick="event.stopPropagation();menu(\\'enrollment\\',\\''+e.id+'\\',\\''+s.name+' · '+(p?.name||'课程')+'\\',\\'报名记录操作\\',()=>editEnrollment(\\''+e.id+'\\'))"><div class="enrollHead"><strong>'+(p?.name||'课程')+'</strong><span>已消 '+fmt(times)+' 课时</span></div><p>'+(t?.name||'')+' · '+(e.renewal==='是'?'续费':'首报')+' · '+e.saleDate+'</p><div class="quickBtns pair"><button onclick="event.stopPropagation();addLesson(\\''+s.id+'\\',\\''+e.id+'\\','+e.defaultHours+')">+1</button><button class="minus" onclick="event.stopPropagation();minusLesson(\\''+e.id+'\\')">-1</button></div></div>'}).join('')+'</div></div>'};
lessonRow=function(l){const m=maps(),e=m.e[l.enrollmentId],p=m.p[l.projectId],t=m.t[l.teacherId],rate=getRate(l.teacherId,l.projectId);return row((e?.studentName||'未知学员')+' · '+fmt(l.hours)+'课时',l.date+' · '+(p?.name||'未分类')+' · '+(t?.name||'未指定')+' · 老师费 '+money(fee(l))+' ('+money(rate)+'/课时)','<i class="pill '+classes[l.status]+'">'+labels[l.status]+'</i>','ondblclick="menu(\\'lesson\\',\\''+l.id+'\\',\\''+(e?.studentName||'未知学员')+' · '+fmt(l.hours)+'课时\\',\\'考勤记录操作\\',()=>editLesson(\\''+l.id+'\\'))"')};
studentCard=function(s){const m=maps(),total=s.enrollments.reduce((a,e)=>a+Number(e.paid||0),0),bought=s.enrollments.reduce((a,e)=>a+Number(e.packageHours||0),0),used=sourceHours(s.enrollments),actual=sourceActual(s.enrollments),cost=sourceTeacherFee(s.enrollments),pct=Math.min(100,used/Math.max(1,bought)*100);return '<div class="quickCard" ondblclick="menu(\\'student\\',\\''+s.id+'\\',\\''+s.name+'\\',\\'学员卡片操作\\',()=>editStudent(\\''+s.id+'\\'))"><div class="quickTop"><div><strong>'+s.name+'</strong><span>'+s.status+' · '+(s.region||'未填地区')+' · '+(s.reason||'未填原因')+'</span></div><span class="actionHint">双击管理</span></div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="quickMeta"><span>总销售 '+money(total)+' / '+s.enrollments.length+' 笔报名</span><span>已消 '+fmt(used)+'课时 / 余 '+fmt(Math.max(0,bought-used))+'课时</span><span>实际课消 '+money(actual)+'</span><span>课消毛利 '+money(actual-cost)+'</span></div><div class="enrollList">'+s.enrollments.map(e=>'<div class="enroll" ondblclick="event.stopPropagation();menu(\\'enrollment\\',\\''+e.id+'\\',\\''+s.name+' · '+(m.p[e.projectId]?.name||'课程')+'\\',\\'报名记录操作\\',()=>editEnrollment(\\''+e.id+'\\'))"><div class="enrollHead"><strong>'+(m.p[e.projectId]?.name||'')+'</strong><span>'+(e.renewal==='是'?'续费':'首报')+' · '+e.saleDate+'</span></div><p>'+(m.t[e.teacherId]?.name||'')+' · 销售 '+money(e.paid)+' · 课消 '+fmt(consumedHours(e))+'课时 / '+money(consumedActual(e))+' · '+e.paymentMethod+'</p></div>').join('')+'</div></div>'};
settings=function(app){const projectRows=state.projects.map(p=>row(p.name,'课程项目 / 报名课程','','ondblclick="menu(\\'project\\',\\''+p.id+'\\',\\''+p.name+'\\',\\'项目操作\\',()=>editProject(\\''+p.id+'\\'))"')).join('');app.innerHTML='<section class="view"><form class="panel form" id="projectForm"><div class="panelTitle"><h2>课程项目</h2><span>新增后所有下拉可选</span></div><label>项目名称<input name="name" placeholder="例如：泰语发音课"></label><button class="primary">添加项目</button></form><section class="panel"><div class="panelTitle"><h2>项目列表</h2><span>'+state.projects.length+' 个</span></div><div class="list">'+projectRows+'</div></section></section>';bind()};
const oldBind=bind;bind=function(){oldBind();const sf=document.getElementById('enrollForm');if(sf){const h=sf.querySelector('[name="packageHours"]'),r=sf.querySelector('[name="hourlyRate"]'),p=sf.querySelector('[name="paid"]'),sync=()=>{if(p.dataset.manual==='1')return;p.value=String((Number(h.value)||0)*(Number(r.value)||0))};h.oninput=sync;r.oninput=sync;p.oninput=()=>p.dataset.manual='1'}};
render();`;
fetch('./index.html?v=source-'+Date.now()).then(r=>r.text()).then(html=>{
  html=html.replace('</style>',css+'</style>');
  html=html.replace('document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});render();',patch+'\ndocument.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});render();');
  document.open();document.write(html);document.close();
}).catch(err=>{document.body.innerHTML='<main><h1>恢复失败</h1><p class="err">'+err.message+'</p></main>'});
</script>
</body>
</html>
